<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <title>EVO — Tu Evolución Personal</title>
  <style>
    :root {
      --bg-main: #09090b;
      --bg-card: #121216;
      --bg-card-hover: #1a1a20;
      --border: #27272a;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.25);
      --green: #10b981;
      --amber: #f59e0b;
      --purple: #8b5cf6;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #000; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    #app-container { width: 100%; max-width: 480px; background-color: var(--bg-main); min-height: 100vh; position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--border); border-right: 1px solid var(--border); overflow-x: hidden; }
    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-col { display: flex; flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .mt-1 { margin-top: 0.25rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-4 { margin-bottom: 1rem; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .text-muted { color: var(--text-muted); }
    .text-accent { color: var(--accent); }
    .text-green { color: var(--green); }
    .text-amber { color: var(--amber); }
    button { cursor: pointer; border: none; border-radius: 12px; font-weight: 600; transition: transform 0.15s ease; }
    button:active { transform: scale(0.97); }
    .btn-primary { background: linear-gradient(135deg, #00e5ff 0%, #0099ff 100%); color: #000; padding: 0.85rem 1.25rem; font-weight: 700; font-size: 0.95rem; box-shadow: 0 4px 15px var(--accent-glow); width: 100%; }
    .btn-secondary { background-color: var(--bg-card-hover); color: var(--text-main); border: 1px solid var(--border); padding: 0.7rem 1rem; font-size: 0.85rem; }
    .btn-danger { background-color: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.7rem 1rem; font-size: 0.85rem; }
    input, select { width: 100%; background-color: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 0.8rem 1rem; border-radius: 12px; font-size: 0.95rem; outline: none; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.35rem; font-weight: 500; }
    .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; }
    .auth-screen { padding: 2rem 1.5rem; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
    .logo-evo { font-size: 3.2rem; font-weight: 900; letter-spacing: -2px; background: linear-gradient(135deg, #fff 30%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
    .device-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
    .device-chip { background: var(--bg-card); border: 1px solid var(--border); padding: 0.7rem; border-radius: 12px; text-align: center; font-size: 0.85rem; cursor: pointer; user-select: none; }
    .device-chip.selected { border-color: var(--accent); background: rgba(0, 229, 255, 0.12); color: var(--accent); font-weight: 600; }
    header { padding: 1rem 1.25rem; background: rgba(9, 9, 11, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
    .badge-pill { background: var(--bg-card); border: 1px solid var(--border); padding: 0.35rem 0.7rem; border-radius: 999px; font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.35rem; }
    main { padding: 1.25rem; padding-bottom: 6rem; flex: 1; }
    .section-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.2rem; }
    .item-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); border: 1px solid var(--border); padding: 0.9rem 1rem; border-radius: 14px; margin-bottom: 0.65rem; gap: 0.5rem; }
    .item-row.completed { border-color: rgba(16, 185, 129, 0.45); background: rgba(16, 185, 129, 0.06); }
    .check-btn { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--border); background: transparent; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 800; flex-shrink: 0; }
    .item-row.completed .check-btn { background: var(--green); border-color: var(--green); }
    .delete-btn { background: transparent; color: var(--text-muted); padding: 0.3rem 0.5rem; font-size: 1rem; }
    .timer-display { font-size: 2.75rem; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; letter-spacing: 1px; color: var(--accent); margin: 0.5rem 0; }
    .progress-bg { width: 100%; height: 10px; background: #1f1f23; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #00e5ff, #3b82f6); border-radius: 999px; transition: width 0.4s ease; }
    .bar-chart { display: flex; align-items: flex-end; justify-content: space-between; height: 120px; padding-top: 1rem; gap: 0.5rem; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; height: 100%; justify-content: flex-end; }
    .bar-stick { width: 100%; max-width: 32px; background: var(--accent); border-radius: 6px 6px 0 0; min-height: 8px; transition: height 0.4s ease; }
    nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: rgba(18, 18, 22, 0.96); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(6, 1fr); padding: 0.5rem 0.25rem; z-index: 30; }
    .nav-btn { background: transparent; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem; padding: 0.35rem 0; border-radius: 10px; font-size: 0.65rem; font-weight: 600; }
    .nav-btn span.icon { font-size: 1.2rem; }
    .nav-btn.active { color: var(--accent); }
    #toast { position: fixed; top: 1.25rem; left: 50%; transform: translateX(-50%) translateY(-120px); background: #18181b; border: 1px solid var(--accent); color: #fff; padding: 0.7rem 1.2rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.7); z-index: 100; transition: transform 0.3s ease; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: flex; align-items: center; justify-content: center; padding: 1.25rem; z-index: 50; }
    .modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 400px; }
  </style>
</head>
<body>
<div id="app-container">
  <div id="toast"></div>
  <div id="root"></div>
</div>
<script>
  const STORAGE_KEY = 'evo_app_data_v3';
  const LEAGUES = [
    { name: 'Hierro', min: 0, max: 300, icon: '🛡️' },
    { name: 'Bronce', min: 300, max: 800, icon: '🥉' },
    { name: 'Plata', min: 800, max: 1500, icon: '🥈' },
    { name: 'Oro', min: 1500, max: 2500, icon: '🥇' },
    { name: 'Platino', min: 2500, max: 4000, icon: '💠' },
    { name: 'Diamante', min: 4000, max: 6000, icon: '💎' },
    { name: 'Maestro', min: 6000, max: 9000, icon: '👑' },
    { name: 'EVO Élite', min: 9000, max: 999999, icon: '⚡' }
  ];

  let state = {
    user: null,
    xp: 0,
    coins: 0,
    streak: 0,
    lastStreakDate: null,
    stats: { fisico: 0, intelecto: 0, disciplina: 0 },
    habits: [
      { id: 1, name: 'Rutina facial básica (Skincare)', lastDoneDate: null },
      { id: 2, name: 'Beber 2 litros de agua', lastDoneDate: null },
      { id: 3, name: 'Hacer la cama al despertar', lastDoneDate: null }
    ],
    sports: [],
    skills: [{ id: 1, name: 'Lectura diaria', days: 0, lastDoneDate: null }],
    shop: [
      { id: 1, name: 'Comida libre / Capricho', cost: 15 },
      { id: 2, name: 'Tarde libre de videojuegos / serie', cost: 25 }
    ],
    redeemed: []
  };

  let currentView = 'onboarding';
  let activeTab = 'habitos';
  let activeModal = null;
  let selectedDevices = ['Móvil'];
  let timerSeconds = 0;
  let timerInterval = null;

  function getTodayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function getYesterdayStr() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        state = JSON.parse(raw);
        if (state.lastStreakDate && state.lastStreakDate !== getTodayStr() && state.lastStreakDate !== getYesterdayStr()) {
          state.streak = 0;
          saveState();
        }
      }
    } catch (e) {}
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
  function getLeague(xp) {
    for (let i = LEAGUES.length - 1; i >= 0; i--) if (xp >= LEAGUES[i].min) return LEAGUES[i];
    return LEAGUES[0];
  }
  function formatTime(sec) {
    return [Math.floor(sec / 3600), Math.floor((sec % 3600) / 60), sec % 60].map(v => String(v).padStart(2, '0')).join(':');
  }

  function toggleDevice(dev) {
    if (selectedDevices.includes(dev)) selectedDevices = selectedDevices.filter(d => d !== dev);
    else selectedDevices.push(dev);
    render();
  }
  function handleRegister(e) {
    e.preventDefault();
    state.user = {
      name: document.getElementById('reg-name').value.trim(),
      age: parseInt(document.getElementById('reg-age').value, 10),
      bday: document.getElementById('reg-bday').value,
      pass: document.getElementById('reg-pass').value,
      devices: selectedDevices.length ? selectedDevices : ['Móvil']
    };
    saveState();
    currentView = 'main';
    render();
    showToast('¡Bienvenido a EVO! 🚀');
  }
  function handleLogin(e) {
    e.preventDefault();
    if (document.getElementById('login-pass').value === state.user.pass) {
      currentView = 'main';
      render();
    } else showToast('❌ Contraseña incorrecta');
  }
  function lockApp() { currentView = 'login'; render(); }
  function setTab(tab) { activeTab = tab; render(); }
  function setModal(m) { activeModal = m; render(); }

  function addHabit(e) {
    e.preventDefault();
    const name = document.getElementById('new-habit').value.trim();
    if (name) { state.habits.push({ id: Date.now(), name, lastDoneDate: null }); saveState(); setModal(null); showToast('✅ Hábito creado'); }
  }
  function doHabit(id) {
    const today = getTodayStr();
    const h = state.habits.find(x => x.id === id);
    if (!h || h.lastDoneDate === today) return showToast('Ya completado hoy');
    h.lastDoneDate = today;
    state.xp += 10; state.coins += 1; state.stats.disciplina += 10;
    if (state.lastStreakDate !== today) { state.streak += 1; state.lastStreakDate = today; showToast(`🔥 ¡Racha: ${state.streak} días! +10 XP · +1 Coin`); }
    else showToast('✅ +10 XP · +1 Coin');
    saveState(); render();
  }
  function delHabit(id) { state.habits = state.habits.filter(x => x.id !== id); saveState(); render(); }

  function toggleTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    else { timerInterval = setInterval(() => { timerSeconds++; const el = document.getElementById('sport-timer'); if (el) el.textContent = formatTime(timerSeconds); }, 1000); }
    render();
  }
  function resetTimer() { clearInterval(timerInterval); timerInterval = null; timerSeconds = 0; render(); }
  function addSport(e) {
    e.preventDefault();
    const type = document.getElementById('sport-type').value;
    const note = document.getElementById('sport-note').value.trim();
    const dur = timerSeconds > 0 ? ` (${formatTime(timerSeconds)})` : '';
    state.sports.unshift({ id: Date.now(), type, note: note + dur, date: getTodayStr() });
    state.xp += 30; state.coins += 3; state.stats.fisico += 30;
    resetTimer(); saveState(); render(); showToast('💪 +30 XP · +3 Coins');
  }

  function addSkill(e) {
    e.preventDefault();
    const name = document.getElementById('new-skill').value.trim();
    if (name) { state.skills.push({ id: Date.now(), name, days: 0, lastDoneDate: null }); saveState(); setModal(null); showToast('🧠 Habilidad creada'); }
  }
  function doSkill(id) {
    const today = getTodayStr();
    const s = state.skills.find(x => x.id === id);
    if (!s || s.lastDoneDate === today) return showToast('Ya practicada hoy');
    s.lastDoneDate = today; s.days += 1;
    state.xp += 20; state.coins += 2; state.stats.intelecto += 20;
    saveState(); render(); showToast(`🧠 ¡Día ${s.days}! +20 XP · +2 Coins`);
  }
  function delSkill(id) { state.skills = state.skills.filter(x => x.id !== id); saveState(); render(); }

  function addReward(e) {
    e.preventDefault();
    const name = document.getElementById('new-reward-name').value.trim();
    const cost = parseInt(document.getElementById('new-reward-cost').value, 10);
    if (name && cost > 0) { state.shop.push({ id: Date.now(), name, cost }); saveState(); setModal(null); showToast('🎁 Premio añadido'); }
  }
  function buyReward(id) {
    const item = state.shop.find(x => x.id === id);
    if (!item) return;
    if (state.coins < item.cost) return showToast('❌ Faltan Coins');
    state.coins -= item.cost;
    state.redeemed.unshift({ id: Date.now(), name: item.name, cost: item.cost, date: getTodayStr() });
    saveState(); render(); showToast(`🎉 ¡Canjeado: ${item.name}!`);
  }
  function delReward(id) { state.shop = state.shop.filter(x => x.id !== id); saveState(); render(); }

  function editProfile(e) {
    e.preventDefault();
    state.user.name = document.getElementById('set-name').value.trim();
    state.user.age = parseInt(document.getElementById('set-age').value, 10);
    state.user.bday = document.getElementById('set-bday').value;
    const p = document.getElementById('set-pass').value;
    if (p && p.length >= 4) state.user.pass = p;
    saveState(); render(); showToast('✅ Perfil guardado');
  }
  function exportBackup() {
    const a = document.createElement('a');
    a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
    a.download = `EVO_Backup_${getTodayStr()}.json`;
    a.click();
    showToast('⬇️ Copia descargada');
  }
  function importBackup(e) {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data && data.user) { state = data; saveState(); render(); showToast('⬆️ Datos cargados'); }
      } catch (err) { showToast('❌ Archivo inválido'); }
    };
    r.readAsText(file);
  }
  function resetAll() {
    if (confirm('¿Borrar todo y empezar desde 0?')) { localStorage.removeItem(STORAGE_KEY); location.reload(); }
  }

  function render() {
    const root = document.getElementById('root');
    if (currentView === 'onboarding') {
      const devs = ['Móvil', 'PC / Portátil', 'Smartwatch', 'Tablet'];
      root.innerHTML = `
        <div class="auth-screen">
          <div class="logo-evo">EVO</div>
          <p class="text-muted text-sm mb-4" style="text-align:center;">Sistema de Evolución Personal</p>
          <form onsubmit="handleRegister(event)" class="flex-col gap-3">
            <div><label>Nombre completo</label><input type="text" id="reg-name" placeholder="Ej. Carlos Mendoza" required></div>
            <div class="flex gap-2">
              <div style="flex:1;"><label>Edad</label><input type="number" id="reg-age" min="10" max="99" placeholder="22" required></div>
              <div style="flex:1.5;"><label>Cumpleaños</label><input type="date" id="reg-bday" required></div>
            </div>
            <div><label>Crea tu contraseña</label><input type="password" id="reg-pass" minlength="4" placeholder="Mínimo 4 caracteres" required></div>
            <div>
              <label>¿Qué dispositivos usas?</label>
              <div class="device-grid">
                ${devs.map(d => `<div class="device-chip ${selectedDevices.includes(d) ? 'selected' : ''}" onclick="toggleDevice('${d}')">${d}</div>`).join('')}
              </div>
            </div>
            <button type="submit" class="btn-primary mt-2">Comenzar mi evolución 🚀</button>
          </form>
        </div>`;
      return;
    }

    if (currentView === 'login') {
      root.innerHTML = `
        <div class="auth-screen">
          <div class="logo-evo">EVO</div>
          <p class="text-muted text-sm mt-2 mb-4" style="text-align:center;">Hola, ${state.user.name}</p>
          <form onsubmit="handleLogin(event)" class="flex-col gap-3">
            <div><label>Contraseña</label><input type="password" id="login-pass" placeholder="••••••" required></div>
            <button type="submit" class="btn-primary">Entrar a EVO</button>
          </form>
        </div>`;
      return;
    }

    const today = getTodayStr();
    const league = getLeague(state.xp);
    let content = '';

    if (activeTab === 'habitos') {
      const doneToday = state.lastStreakDate === today;
      content = `
        <div class="flex items-center justify-between mb-3">
          <div><h1 class="section-title">Hábitos Diarios</h1><p class="text-xs text-muted">Mínimo 1 al día para racha (+10 XP · +1 Coin)</p></div>
          <button class="btn-primary" style="width:auto;padding:0.6rem 0.9rem;font-size:0.8rem;" onclick="setModal('habit')">+ Hábito</button>
        </div>
        <div class="card mb-4 flex items-center justify-between" style="border-color:rgba(245,158,11,0.35);">
          <div><div class="text-xs text-muted">Racha actual</div><div class="font-extrabold" style="font-size:1.4rem;">🔥 ${state.streak} días</div></div>
          <div class="badge-pill" style="color:${doneToday ? 'var(--green)' : 'var(--text-muted)'};border-color:${doneToday ? 'var(--green)' : 'var(--border)'};">${doneToday ? '✅ Racha asegurada hoy' : '⏳ Haz 1 hábito hoy'}</div>
        </div>
        ${state.habits.map(h => {
          const done = h.lastDoneDate === today;
          return `<div class="item-row ${done ? 'completed' : ''}">
            <div class="flex items-center gap-3" style="flex:1;cursor:pointer;" onclick="doHabit(${h.id})">
              <button type="button" class="check-btn">${done ? '✓' : ''}</button>
              <div><div class="text-sm font-bold" style="${done ? 'text-decoration:line-through;opacity:0.7;' : ''}">${h.name}</div><div class="text-xs text-muted">+10 XP · +1 Coin</div></div>
            </div>
            <button type="button" class="delete-btn" onclick="delHabit(${h.id})">✕</button>
          </div>`;
        }).join('')}`;
    }

    if (activeTab === 'deporte') {
      content = `
        <h1 class="section-title">Deporte & Físico</h1>
        <p class="text-xs text-muted mb-3">Entrena cualquier disciplina (+30 XP · +3 Coins)</p>
        <div class="card mb-4">
          <div class="flex justify-between items-center"><span class="text-xs font-bold text-muted">CRONÓMETRO</span><span class="text-xs text-accent">${timerInterval ? 'Entrenando...' : 'Listo'}</span></div>
          <div class="timer-display" id="sport-timer">${formatTime(timerSeconds)}</div>
          <div class="flex gap-2">
            <button type="button" class="btn-primary" onclick="toggleTimer()">${timerInterval ? 'Pausar' : 'Iniciar'}</button>
            <button type="button" class="btn-secondary" onclick="resetTimer()">Reiniciar</button>
          </div>
        </div>
        <div class="card mb-4">
          <h3 class="text-sm font-bold mb-2">Registrar Entrenamiento</h3>
          <form onsubmit="addSport(event)" class="flex-col gap-2">
            <select id="sport-type">
              <option>🏋️ Gimnasio / Pesas</option><option>🏃 Running / Cardio</option><option>⚽ Fútbol / Equipo</option>
              <option>🥊 Artes Marciales / Boxeo</option><option>🤸 Calistenia</option><option>🚴 Ciclismo / Natación</option><option>⚡ Otro deporte</option>
            </select>
            <input type="text" id="sport-note" placeholder="Ej. 45 min pesas / 5 km" required>
            <button type="submit" class="btn-primary mt-1">Completar (+30 XP · +3 🪙)</button>
          </form>
        </div>
        <h3 class="text-sm font-bold mb-2">Historial Reciente</h3>
        ${state.sports.slice(0, 10).map(s => `<div class="item-row"><div><div class="text-sm font-bold">${s.type}</div><div class="text-xs text-muted">${s.note} · ${s.date}</div></div><span class="text-xs font-bold text-accent">+30 XP</span></div>`).join('') || '<p class="text-xs text-muted">Sin entrenamientos aún.</p>'}`;
    }

    if (activeTab === 'habilidades') {
      content = `
        <div class="flex items-center justify-between mb-3">
          <div><h1 class="section-title">Habilidades</h1><p class="text-xs text-muted">+20 XP · +2 Coins · 30 días = Dominada</p></div>
          <button type="button" class="btn-primary" style="width:auto;padding:0.6rem 0.9rem;font-size:0.8rem;" onclick="setModal('skill')">+ Habilidad</button>
        </div>
        ${state.skills.map(sk => {
          const done = sk.lastDoneDate === today;
          return `<div class="item-row ${done ? 'completed' : ''}">
            <div style="flex:1;">
              <div class="text-sm font-bold">${sk.name} ${sk.days >= 30 ? '🏆' : ''}</div>
              <div class="text-xs text-muted">${sk.days} / 30 días practicados</div>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" class="${done ? 'btn-secondary' : 'btn-primary'}" style="width:auto;padding:0.45rem 0.75rem;font-size:0.75rem;" onclick="doSkill(${sk.id})">${done ? 'Hecho ✓' : 'Practicar hoy'}</button>
              <button type="button" class="delete-btn" onclick="delSkill(${sk.id})">✕</button>
            </div>
          </div>`;
        }).join('')}`;
    }

    if (activeTab === 'tienda') {
      content = `
        <div class="flex items-center justify-between mb-3">
          <div><h1 class="section-title">Tienda EVO</h1><p class="text-xs text-muted">Canjea tus Coins por premios reales</p></div>
          <button type="button" class="btn-primary" style="width:auto;padding:0.6rem 0.9rem;font-size:0.8rem;" onclick="setModal('shop')">+ Premio</button>
        </div>
        <div class="card mb-4 flex items-center justify-between"><span class="text-sm text-muted">Saldo disponible</span><span class="font-extrabold text-amber" style="font-size:1.3rem;">🪙 ${state.coins} Coins</span></div>
        ${state.shop.map(it => `<div class="item-row">
          <div><div class="text-sm font-bold">${it.name}</div><div class="text-xs text-amber font-bold">🪙 ${it.cost} Coins</div></div>
          <div class="flex items-center gap-2">
            <button type="button" class="btn-primary" style="width:auto;padding:0.45rem 0.8rem;font-size:0.75rem;" onclick="buyReward(${it.id})">Canjear</button>
            <button type="button" class="delete-btn" onclick="delReward(${it.id})">✕</button>
          </div>
        </div>`).join('')}
        <h3 class="text-sm font-bold mt-4 mb-2">Premios Canjeados</h3>
        ${state.redeemed.slice(0, 8).map(r => `<div class="item-row" style="padding:0.65rem 0.9rem;"><span class="text-xs font-bold">🎁 ${r.name}</span><span class="text-xs text-muted">${r.date} (-${r.cost} 🪙)</span></div>`).join('') || '<p class="text-xs text-muted">Ningún premio canjeado aún.</p>'}`;
    }

    if (activeTab === 'perfil') {
      const pct = Math.min(100, Math.round(((state.xp - league.min) / (league.max - league.min)) * 100));
      const maxStat = Math.max(100, state.stats.fisico, state.stats.intelecto, state.stats.disciplina);
      const bars = [
        { l: 'Físico', v: state.stats.fisico, c: '#00e5ff' },
        { l: 'Intelecto', v: state.stats.intelecto, c: '#8b5cf6' },
        { l: 'Disciplina', v: state.stats.disciplina, c: '#10b981' }
      ];
      const mastered = state.skills.filter(s => s.days >= 30);
      const inProg = state.skills.filter(s => s.days < 30);
      const achs = [
        { t: 'Primer Paso', d: 'Racha de 1 día', ok: state.streak >= 1 },
        { t: 'Semana de Hierro', d: 'Racha de 7 días', ok: state.streak >= 7 },
        { t: 'Atleta Constante', d: '5 entrenamientos registrados', ok: state.sports.length >= 5 },
        { t: 'Mente Maestra', d: '1 habilidad dominada (30 días)', ok: mastered.length >= 1 },
        { t: 'Ascenso a Plata', d: 'Supera los 800 XP', ok: state.xp >= 800 }
      ];
      content = `
        <div class="card mb-3">
          <div class="flex justify-between items-center">
            <div><h1 class="section-title">${state.user.name}</h1><p class="text-xs text-muted">${state.user.age} años · Cumpleaños: ${state.user.bday}</p></div>
            <div class="badge-pill" style="border-color:var(--accent);color:var(--accent);">${league.icon} ${league.name}</div>
          </div>
          ${state.user.bday && state.user.bday.slice(5) === today.slice(5) ? '<div class="mt-3" style="background:rgba(0,229,255,0.12);border:1px solid var(--accent);padding:0.6rem;border-radius:10px;font-size:0.8rem;text-align:center;">🎂 ¡Feliz cumpleaños!</div>' : ''}
          <div class="mt-4">
            <div class="flex justify-between text-xs mb-1"><span class="font-bold">Liga ${league.name}</span><span class="text-muted">${state.xp} / ${league.max} XP</span></div>
            <div class="progress-bg"><div class="progress-fill" style="width:${pct}%;"></div></div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;" class="mt-4">
            <div style="background:var(--bg-main);padding:0.7rem;border-radius:12px;text-align:center;"><div class="text-xs text-muted">XP Total</div><div class="font-extrabold text-accent">${state.xp}</div></div>
            <div style="background:var(--bg-main);padding:0.7rem;border-radius:12px;text-align:center;"><div class="text-xs text-muted">Coins</div><div class="font-extrabold text-amber">${state.coins}</div></div>
            <div style="background:var(--bg-main);padding:0.7rem;border-radius:12px;text-align:center;"><div class="text-xs text-muted">Racha</div><div class="font-extrabold text-green">${state.streak} d</div></div>
          </div>
        </div>
        <div class="card mb-3">
          <h3 class="text-sm font-bold mb-2">Estadísticas</h3>
          <div class="bar-chart">${bars.map(b => `<div class="bar-col"><span class="text-xs font-bold">${b.v}</span><div class="bar-stick" style="height:${Math.max(8, Math.round((b.v / maxStat) * 100))}%;background:${b.c};"></div><span class="text-xs text-muted">${b.l}</span></div>`).join('')}</div>
        </div>
        <div class="card mb-3">
          <h3 class="text-sm font-bold mb-2">Habilidades</h3>
          <div class="text-xs text-muted mb-1">🏆 Dominadas (30+ días)</div>
          <div class="mb-2">${mastered.map(s => `<span class="badge-pill" style="margin:2px;">🏆 ${s.name}</span>`).join('') || '<span class="text-xs text-muted">Ninguna todavía</span>'}</div>
          <div class="text-xs text-muted mb-1">⏳ En proceso</div>
          <div>${inProg.map(s => `<span class="badge-pill" style="margin:2px;">${s.name} (${s.days}d)</span>`).join('') || '<span class="text-xs text-muted">Ninguna</span>'}</div>
        </div>
        <div class="card"><h3 class="text-sm font-bold mb-2">Logros</h3><div class="flex-col gap-2">${achs.map(a => `<div class="item-row" style="margin-bottom:0;opacity:${a.ok ? '1' : '0.45'};"><div><div class="text-xs font-bold">${a.ok ? '🏅' : '🔒'} ${a.t}</div><div class="text-xs text-muted">${a.d}</div></div><span class="text-xs font-bold ${a.ok ? 'text-green' : 'text-muted'}">${a.ok ? 'Listo' : 'Bloqueado'}</span></div>`).join('')}</div></div>`;
    }

    if (activeTab === 'ajustes') {
      content = `
        <h1 class="section-title mb-3">Ajustes</h1>
        <div class="card mb-3">
          <h3 class="text-sm font-bold mb-2">Editar Perfil</h3>
          <form onsubmit="editProfile(event)" class="flex-col gap-2">
            <div><label>Nombre completo</label><input type="text" id="set-name" value="${state.user.name}" required></div>
            <div class="flex gap-2">
              <div style="flex:1;"><label>Edad</label><input type="number" id="set-age" value="${state.user.age}" required></div>
              <div style="flex:1.5;"><label>Cumpleaños</label><input type="date" id="set-bday" value="${state.user.bday}" required></div>
            </div>
            <div><label>Nueva contraseña (opcional)</label><input type="password" id="set-pass" placeholder="••••••"></div>
            <button type="submit" class="btn-primary mt-1">Guardar Cambios</button>
          </form>
        </div>
        <div class="card mb-3"><h3 class="text-sm font-bold mb-1">Dispositivos</h3><p class="text-xs text-muted">${state.user.devices.join(' · ')}</p></div>
        <div class="card mb-3">
          <h3 class="text-sm font-bold mb-1">Copia de Seguridad</h3>
          <p class="text-xs text-muted mb-3">Guarda o carga tu progreso en otro dispositivo.</p>
          <div class="flex gap-2">
            <button type="button" class="btn-secondary" style="flex:1;" onclick="exportBackup()">⬇️ Exportar</button>
            <label class="btn-secondary" style="flex:1;text-align:center;margin:0;cursor:pointer;">⬆️ Cargar<input type="file" accept=".json" class="hidden" onchange="importBackup(event)"></label>
          </div>
        </div>
        <div class="card flex-col gap-2">
          <button type="button" class="btn-secondary" onclick="lockApp()">🔒 Bloquear App</button>
          <button type="button" class="btn-danger" onclick="resetAll()">⚠️ Reiniciar todo desde 0</button>
        </div>`;
    }

    let modalHtml = '';
    if (activeModal === 'habit') modalHtml = `<div class="modal-backdrop"><div class="modal-box"><h3 class="font-bold mb-3">Nuevo Hábito</h3><form onsubmit="addHabit(event)" class="flex-col gap-3"><input type="text" id="new-habit" placeholder="Ej. Skincare, 2L agua..." required><div class="flex gap-2"><button type="button" class="btn-secondary" style="flex:1;" onclick="setModal(null)">Cancelar</button><button type="submit" class="btn-primary" style="flex:1;">Crear</button></div></form></div></div>`;
    if (activeModal === 'skill') modalHtml = `<div class="modal-backdrop"><div class="modal-box"><h3 class="font-bold mb-3">Nueva Habilidad</h3><form onsubmit="addSkill(event)" class="flex-col gap-3"><input type="text" id="new-skill" placeholder="Ej. Inglés, Guitarra..." required><div class="flex gap-2"><button type="button" class="btn-secondary" style="flex:1;" onclick="setModal(null)">Cancelar</button><button type="submit" class="btn-primary" style="flex:1;">Crear</button></div></form></div></div>`;
    if (activeModal === 'shop') modalHtml = `<div class="modal-backdrop"><div class="modal-box"><h3 class="font-bold mb-3">Nueva Recompensa</h3><form onsubmit="addReward(event)" class="flex-col gap-3"><input type="text" id="new-reward-name" placeholder="Nombre del premio" required><input type="number" id="new-reward-cost" min="1" placeholder="Precio en Coins" required><div class="flex gap-2"><button type="button" class="btn-secondary" style="flex:1;" onclick="setModal(null)">Cancelar</button><button type="submit" class="btn-primary" style="flex:1;">Crear</button></div></form></div></div>`;

    const navItems = [
      { id: 'habitos', ic: '✅', tx: 'Hábitos' },
      { id: 'deporte', ic: '💪', tx: 'Deporte' },
      { id: 'habilidades', ic: '🧠', tx: 'Habilidades' },
      { id: 'tienda', ic: '🛒', tx: 'Tienda' },
      { id: 'perfil', ic: '👤', tx: 'Perfil' },
      { id: 'ajustes', ic: '⚙️', tx: 'Ajustes' }
    ];

    root.innerHTML = `
      <header class="flex items-center justify-between">
        <div class="flex items-center gap-2"><span class="font-extrabold" style="font-size:1.35rem;letter-spacing:-1px;color:var(--accent);">EVO</span><span class="text-xs text-muted">${league.icon} ${league.name}</span></div>
        <div class="flex items-center gap-2">
          <div class="badge-pill">🔥 ${state.streak}</div>
          <div class="badge-pill"><span class="text-accent">⚡</span> ${state.xp}</div>
          <div class="badge-pill"><span class="text-amber">🪙</span> ${state.coins}</div>
        </div>
      </header>
      <main>${content}</main>
      <nav>${navItems.map(n => `<button type="button" class="nav-btn ${activeTab === n.id ? 'active' : ''}" onclick="setTab('${n.id}')"><span class="icon">${n.ic}</span><span>${n.tx}</span></button>`).join('')}</nav>
      ${modalHtml}
    `;
  }

  loadState();
  if (state.user) currentView = 'login';
  render();
</script>
</body>
</html>
