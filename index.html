<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>EVO — Tu Evolución Personal</title>
  <style>
    :root {
      --bg-main: #09090b;
      --bg-card: #121216;
      --bg-card-hover: #1a1a20;
      --border: #27272a;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.28);
      --green: #10b981;
      --amber: #f59e0b;
      --purple: #8b5cf6;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background-color: #050507;
      color: var(--text-main);
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      background: radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.08) 0%, #050507 65%);
    }

    #app-container {
      width: 100%;
      max-width: 820px;
      background-color: var(--bg-main);
      min-height: 100dvh;
      position: relative;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
    }

    @media (max-width: 820px) {
      #app-container {
        border-left: none;
        border-right: none;
      }
    }

    /* Animaciones Keyframes */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9); }
      70% { transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes pulseFlame {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.4)); }
      50% { transform: scale(1.18); filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.85)); }
    }

    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.3)); }
      50% { filter: drop-shadow(0 0 18px rgba(0, 229, 255, 0.7)); }
    }

    @keyframes shimmerBar {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .anim-tab {
      animation: fadeSlideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .flame-anim {
      display: inline-block;
      animation: pulseFlame 1.8s infinite ease-in-out;
    }

    /* Utilidades */
    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-col { display: flex; flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .gap-1 { gap: 0.25rem; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .gap-4 { gap: 1rem; }
    .mt-1 { margin-top: 0.25rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-4 { margin-bottom: 1rem; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .text-muted { color: var(--text-muted); }
    .text-accent { color: var(--accent); }
    .text-green { color: var(--green); }
    .text-amber { color: var(--amber); }

    /* Botones e Inputs */
    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background-color 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: scale(0.95); }

    .btn-primary {
      background: linear-gradient(135deg, #00e5ff 0%, #0099ff 100%);
      color: #000;
      padding: 0.85rem 1.25rem;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 4px 16px var(--accent-glow);
      width: 100%;
    }

    .btn-primary:hover {
      box-shadow: 0 6px 22px rgba(0, 229, 255, 0.45);
    }

    .btn-secondary {
      background-color: var(--bg-card-hover);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
    }

    input, select {
      width: 100%;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.8rem 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      font-weight: 500;
    }

    /* Tarjetas */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.1rem;
      transition: transform 0.2s ease, border-color 0.25s ease;
    }

    .card:hover {
      border-color: #3f3f46;
    }

    /* Pantallas Auth */
    .auth-screen {
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100dvh;
      max-width: 440px;
      margin: 0 auto;
      width: 100%;
      animation: fadeSlideUp 0.45s ease forwards;
    }

    .logo-evo {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #fff 25%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      animation: logoGlow 3s infinite ease-in-out;
    }

    .device-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
    }

    .device-chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.75rem;
      border-radius: 12px;
      text-align: center;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .device-chip.selected {
      border-color: var(--accent);
      background: rgba(0, 229, 255, 0.14);
      color: var(--accent);
      font-weight: 700;
      transform: scale(1.02);
    }

    /* Header Superior */
    header {
      padding: calc(0.85rem + env(safe-area-inset-top)) 1.25rem 0.85rem 1.25rem;
      background: rgba(9, 9, 11, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .badge-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.35rem 0.68rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s ease;
    }

    .music-toggle {
      cursor: pointer;
      border-color: rgba(0, 229, 255, 0.35);
    }

    .music-toggle.playing {
      background: rgba(0, 229, 255, 0.15);
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Contenido Principal */
    main {
      padding: 1.25rem;
      padding-bottom: calc(5.8rem + env(safe-area-inset-bottom));
      flex: 1;
      width: 100%;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 0.2rem;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.9rem 1rem;
      border-radius: 14px;
      margin-bottom: 0.65rem;
      gap: 0.5rem;
      transition: transform 0.2s ease, border-color 0.25s ease, background-color 0.25s ease;
    }

    .item-row:hover {
      transform: translateX(3px);
      border-color: #3f3f46;
    }

    .item-row.completed {
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.07);
    }

    .check-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 800;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .item-row.completed .check-btn {
      background: var(--green);
      border-color: var(--green);
      transform: scale(1.08);
    }

    .delete-btn {
      background: transparent;
      color: var(--text-muted);
      padding: 0.3rem 0.5rem;
      font-size: 1rem;
    }

    .delete-btn:hover { color: var(--red); }

    .timer-display {
      font-size: clamp(2.3rem, 7vw, 3.2rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: center;
      letter-spacing: 1px;
      color: var(--accent);
      margin: 0.5rem 0;
      text-shadow: 0 0 18px var(--accent-glow);
    }

    .progress-bg {
      width: 100%;
      height: 11px;
      background: #1f1f23;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00e5ff, #3b82f6, #00e5ff);
      background-size: 200% 100%;
      animation: shimmerBar 3s linear infinite;
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 130px;
      padding-top: 1rem;
      gap: 0.75rem;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      height: 100%;
      justify-content: flex-end;
    }

    .bar-stick {
      width: 100%;
      max-width: 42px;
      background: var(--accent);
      border-radius: 8px 8px 0 0;
      min-height: 8px;
      transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Navegación Inferior Responsiva */
    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 820px;
      background: rgba(18, 18, 22, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      padding: 0.5rem 0.25rem calc(0.5rem + env(safe-area-inset-bottom)) 0.25rem;
      z-index: 30;
    }

    .nav-btn {
      background: transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 0.35rem 0;
      border-radius: 10px;
      font-size: 0.68rem;
      font-weight: 600;
    }

    .nav-btn span.icon {
      font-size: 1.22rem;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-btn.active {
      color: var(--accent);
    }

    .nav-btn.active span.icon {
      transform: translateY(-2px) scale(1.15);
    }

    /* Toast */
    #toast {
      position: fixed;
      top: calc(1.25rem + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-130px);
      background: #18181b;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 0.7rem 1.25rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.75);
      z-index: 100;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 50;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Partículas / Confeti neón */
    .particle {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.85s ease;
    }

    /* Grid adaptable en pantallas grandes */
    @media (min-width: 640px) {
      .grid-2-desktop {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }
      .grid-2-desktop .item-row {
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>
<div id="app-container">
  <div id="toast"></div>
  <div id="root"></div>
</div>

<script>
  const STORAGE_KEY = 'evo_app_data_v2';
  const LEAGUES = [
    { name: 'Hierro', min: 0, max: 300, icon: '🛡️' },
    { name: 'Bronce', min: 300, max: 800, icon: '🥉' },
    { name: 'Plata', min: 800, max: 1500, icon: '🥈' },
    { name: 'Oro', min: 1500, max: 2500, icon: '🥇' },
    { name: 'Platino', min: 2500, max: 4000, icon: '💠' },
    { name: 'Diamante', min: 4000, max: 6000, icon: '💎' },
    { name: 'Maestro', min: 6000, max: 9000, icon: '👑' },
    { name: 'EVO Élite', min: 9000, max: 999999, icon: '⚡' }
  ];

  let state = {
    user: null,
    xp: 0,
    coins: 0,
    streak: 0,
    lastStreakDate: null,
    stats: { fisico: 0, intelecto: 0, disciplina: 0 },
    habits: [
      { id: 1, name: 'Rutina facial básica (Skincare)', lastDoneDate: null },
      { id: 2, name: 'Beber 2 litros de agua', lastDoneDate: null },
      { id: 3, name: 'Hacer la cama al despertar', lastDoneDate: null }
    ],
    sports: [],
    skills: [{ id: 1, name: 'Lectura diaria', days: 0, lastDoneDate: null }],
    shop: [
      { id: 1, name: 'Comida libre / Capricho', cost: 15 },
      { id: 2, name: 'Tarde libre de videojuegos / serie', cost: 25 }
    ],
    redeemed: []
  };

  let currentView = 'onboarding';
  let activeTab = 'habitos';
  let activeModal = null;
  let selectedDevices = ['Móvil'];
  let timerSeconds = 0;
  let timerInterval = null;

  // --- MOTOR DE AUDIO Y MÚSICA DE FONDO (Web Audio API) ---
  let audioCtx = null;
  let musicPlaying = false;
  let musicTimer = null;
  let musicStep = 0;
  let musicVolume = 0.08;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSfx(type) {
    try {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.16);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'levelup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.09);
        osc.frequency.setValueAtTime(659.25, now + 0.18);
        osc.frequency.setValueAtTime(880, now + 0.27);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      } else if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.06);
      }
    } catch (e) {}
  }

  // Secuencia ambiental chill / synthwave suave en bucle
  const AMBIENT_NOTES = [
    220.00, 261.63, 329.63, 392.00,
    196.00, 246.94, 293.66, 392.00,
    174.61, 220.00, 261.63, 349.23,
    164.81, 196.00, 246.94, 329.63
  ];

  function playAmbientStep() {
    if (!musicPlaying) return;
    try {
      initAudio();
      const now = audioCtx.currentTime;
      const freq = AMBIENT_NOTES[musicStep % AMBIENT_NOTES.length];
      musicStep++;

      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(750, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(musicVolume, now + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 1.15);
    } catch (e) {}
  }

  function toggleMusic() {
    musicPlaying = !musicPlaying;
    if (musicPlaying) {
      initAudio();
      playAmbientStep();
      musicTimer = setInterval(playAmbientStep, 650);
      showToast('🎵 Música ambiental activada');
    } else {
      clearInterval(musicTimer);
      musicTimer = null;
      showToast('🔇 Música pausada');
    }
    render();
  }

  function updateVolume(val) {
    musicVolume = parseFloat(val);
  }

  // --- PARTÍCULAS NEÓN AL COMPLETAR TAREAS ---
  function spawnParticles(color = '#00e5ff') {
    const colors = [color, '#10b981', '#f59e0b', '#ffffff'];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 22; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.backgroundColor = colors[i % colors.length];
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      document.body.appendChild(p);

      const angle = (Math.PI * 2 * i) / 22 + (Math.random() * 0.4);
      const dist = 70 + Math.random() * 120;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 30;

      requestAnimationFrame(() => {
        p.style.transform = `translate(${dx}px, ${dy}px) scale(0.2)`;
        p.style.opacity = '0';
      });
      setTimeout(() => p.remove(), 900);
    }
  }

  // --- UTILIDADES DE FECHA Y ESTADO ---
  function getTodayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function getYesterdayStr() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        state = JSON.parse(raw);
        if (state.lastStreakDate && state.lastStreakDate !== getTodayStr() && state.lastStreakDate !== getYesterdayStr()) {
          state.streak = 0;
          saveState();
        }
      }
    } catch (e) {}
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function getLeague(xp) {
    for (let i = LEAGUES.length - 1; i >= 0; i--) {
      if (xp >= LEAGUES[i].min) return LEAGUES[i];
    }
    return LEAGUES[0];
  }

  function formatTime(sec) {
    return [Math.floor(sec / 3600), Math.floor((sec % 3600) / 60), sec % 60]
      .map(v => String(v).padStart(2, '0'))
      .join(':');
  }

  // --- ACCIONES ---
  function toggleDevice(dev) {
    playSfx('click');
    if (selectedDevices.includes(dev)) {
      selectedDevices = selectedDevices.filter(d => d !== dev);
    } else {
      selectedDevices.push(dev);
    }
    render();
  }

  function handleRegister(e) {
    e.preventDefault();
    state.user = {
      name: document.getElementById('reg-name').value.trim(),
      age: parseInt(document.getElementById('reg-age').value, 10),
      bday: document.getElementById('reg-bday').value,
      pass: document.getElementById('reg-pass').value,
      devices: selectedDevices.length ? selectedDevices : ['Móvil']
    };
    saveState();
    currentView = 'main';
    playSfx('levelup');
    spawnParticles('#00e5ff');
    render();
    showToast('¡Bienvenido a EVO! 🚀');
  }

  function handleLogin(e) {
    e.preventDefault();
    if (document.getElementById('login-pass').value === state.user.pass) {
      currentView = 'main';
      playSfx('success');
      render();
    } else {
      showToast('❌ Contraseña incorrecta');
    }
  }

  function lockApp() {
    currentView = 'login';
    render();
  }

  function setTab(tab) {
    playSfx('click');
    activeTab = tab;
    render();
  }

  function setModal(m) {
    playSfx('click');
    activeModal = m;
    render();
  }

  function addHabit(e) {
    e.preventDefault();
    const name = document.getElementById('new-habit').value.trim();
    if (name) {
      state.habits.push({ id: Date.now(), name, lastDoneDate: null });
      saveState();
      playSfx('success');
      setModal(null);
      showToast('✅ Hábito creado');
    }
  }

  function doHabit(id) {
    const today = getTodayStr();
    const h = state.habits.find(x => x.id === id);
    if (!h || h.lastDoneDate === today) return showToast('Ya completado hoy');
    h.lastDoneDate = today;
    state.xp += 10;
    state.coins += 1;
    state.stats.disciplina += 10;
    spawnParticles('#10b981');
    if (state.lastStreakDate !== today) {
      state.streak += 1;
      state.lastStreakDate = today;
      playSfx('levelup');
      showToast(`🔥 ¡Racha: ${state.streak} días! +10 XP · +1 Coin`);
    } else {
      playSfx('success');
      showToast('✅ +10 XP · +1 Coin');
    }
    saveState();
    render();
  }

  function delHabit(id) {
    state.habits = state.habits.filter(x => x.id !== id);
    saveState();
    render();
  }

  function toggleTimer() {
    playSfx('click');
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    } else {
      timerInterval = setInterval(() => {
        timerSeconds++;
        const el = document.getElementById('sport-timer');
        if (el) el.textContent = formatTime(timerSeconds);
      }, 1000);
    }
    render();
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    timerSeconds = 0;
    render();
  }

  function addSport(e) {
    e.preventDefault();
    const type = document.getElementById('sport-type').value;
    const note = document.getElementById('sport-note').value.trim();
    const dur = timerSeconds > 0 ? ` (${formatTime(timerSeconds)})` : '';
    state.sports.unshift({ id: Date.now(), type, note: note + dur, date: getTodayStr() });
    state.xp += 30;
    state.coins += 3;
    state.stats.fisico += 30;
    resetTimer();
    saveState();
    playSfx('levelup');
    spawnParticles('#00e5ff');
    render();
    showToast('💪 +30 XP · +3 Coins');
  }

  function addSkill(e) {
    e.preventDefault();
    const name = document.getElementById('new-skill').value.trim();
    if (name) {
      state.skills.push({ id: Date.now(), name, days: 0, lastDoneDate: null });
      saveState();
      playSfx('success');
      setModal(null);
      showToast('🧠 Habilidad creada');
    }
  }

  function doSkill(id) {
    const today = getTodayStr();
    const s = state.skills.find(x => x.id === id);
    if (!s || s.lastDoneDate === today) return showToast('Ya practicada hoy');
    s.lastDoneDate = today;
    s.days += 1;
    state.xp += 20;
    state.coins += 2;
    state.stats.intelecto += 20;
    saveState();
    playSfx('success');
    spawnParticles('#8b5cf6');
    render();
    showToast(`🧠 ¡Día ${s.days}! +20 XP · +2 Coins`);
  }

  function delSkill(id) {
    state.skills = state.skills.filter(x => x.id !== id);
    saveState();
    render();
  }

  function addReward(e) {
    e.preventDefault();
    const name = document.getElementById('new-reward-name').value.trim();
    const cost = parseInt(document.getElementById('new-reward-cost').value, 10);
    if (name && cost > 0) {
      state.shop.push({ id: Date.now(), name, cost });
      saveState();
      playSfx('success');
      setModal(null);
      showToast('🎁 Premio añadido');
    }
  }

  function buyReward(id) {
    const item = state.shop.find(x => x.id === id);
    if (!item) return;
    if (state.coins < item.cost) return showToast('❌ Faltan Coins');
    state.coins -= item.cost;
    state.redeemed.unshift({ id: Date.now(), name: item.name, cost: item.cost, date: getTodayStr() });
    saveState();
    playSfx('levelup');
    spawnParticles('#f59e0b');
    render();
    showToast(`🎉 ¡Canjeado: ${item.name}!`);
  }

  function delReward(id) {
    state.shop = state.shop.filter(x => x.id !== id);
    saveState();
    render();
  }

  function editProfile(e) {
    e.preventDefault();
    state.user.name = document.getElementById('set-name').value.trim();
    state.user.age = parseInt(document.getElementById('set-age').value, 10);
    state.user.bday = document.getElementById('set-bday').value;
    const p = document.getElementById('set-pass').value;
    if (p && p.length >= 4) state.user.pass = p;
    saveState();
    playSfx('success');
    render();
    showToast('✅ Perfil guardado');
  }

  function exportBackup() {
    const a = document.createElement('a');
    a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
    a.download = `EVO_Backup_${getTodayStr()}.json`;
    a.click();
    showToast('⬇️ Copia descargada');
  }

  function importBackup(e) {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data && data.user) {
          state = data;
          saveState();
          render();
          showToast('⬆️ Datos cargados');
        }
      } catch (err) {
        showToast('❌ Archivo inválido');
      }
    };
    r.readAsText(file);
  }

  function resetAll() {
    if (confirm('¿Borrar todo y empezar desde 0?')) {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  }

  // --- RENDERIZADO ---
  function render() {
    const root = document.getElementById('root');

    if (currentView === 'onboarding') {
      const devs = ['Móvil', 'PC / Portátil', 'Smartwatch', 'Tablet'];
      root.innerHTML = `
        <div class="auth-screen">
          <div class="logo-evo">EVO</div>
          <p class="text-muted text-sm mb-4" style="text-align:center;">Sistema de Evolución Personal</p>
          <form onsubmit="handleRegister(event)" class="flex-col gap-3">
            <div><label>Nombre completo</label><input type="text" id="reg-name" placeholder="Ej. Carlos Mendoza" required></div>
            <div class="flex gap-2">
              <div style="flex:1;"><label>Edad</label><input type="number" id="reg-age" min="10" max="99" placeholder="22" required></div>
              <div style="flex:1.5;"><label>Cumpleaños</label><input type="date" id="reg-bday" required></div>
            </div>
            <div><label>Crea tu contraseña</label><input type="password" id="reg-pass" minlength="4" placeholder="Mínimo 4 caracteres" required></div>
            <div>
              <label>¿Qué dispositivos usas?</label>
              <div class="device-grid">
                ${devs.map(d => `<div class="device-chip ${selectedDevices.includes(d) ? 'selected' : ''}" onclick="toggleDevice('${d}')">${d}</div>`).join('')}

    }

    if (activeTab === 'habilidades') {
      content = `
        <div class="anim-tab">
          <div class="flex items-center justify-between mb-3">
            <div><h1 class="section-title">Habilidades</h1><p class="text-xs text-muted">+20 XP · +2 Coins · 30 días = Dominada</p></div>

                <div class="flex items-center gap-2">
                  <button class="${done ? 'btn-secondary' : 'btn-primary'}" style="width:auto;padding:0.45rem 0.75rem;font-size:0.75rem;" onclick="doSkill(${sk.id})">${done ? 'Hecho ✓' : 'Practicar hoy'}</button>

        </div>`;
    }

    if (activeTab === 'ajustes') {
      content = `
        <div class="anim-tab">
          <h1 class="section-title mb-3">Ajustes</h1>

          </div>
          <div class="card flex-col gap-2">
            <button class="btn-secondary" onclick="lockApp()">🔒 Bloquear App</button>
            <button class="btn-danger" onclick="resetAll()">⚠️ Reiniciar todo desde 0</button>
          </div>
        </div>`;
    }

    let modalHtml = '';
    if (activeModal === 'habit') modalHtml = `<div class="modal-backdrop"><div class="modal-box"><h3 class="font-bold mb-3">Nuevo Hábito</h3><form onsubmit="addHabit(event)" class="flex-col gap-3"><input type="text" id="new-habit" placeholder="Ej. Skincare, 2L agua..." required><div class="flex gap-2"><button type="button" class="btn-secondary" style="flex:1;" onclick="setModal(null)">Cancelar</button><button type="submit" class="btn-primary" style="flex:1;">Crear</button></div></form></div></div>`;
    if (activeModal === 'skill') modalHtml = `<div class="modal-backdrop"><div class="modal-box"><h3 class="font-bold mb-3">Nueva Habilidad</h3><form onsubmit="addSkill(event)" class="flex-col gap-3"><input type="text" id="new-skill" placeholder="Ej. Inglés, Guitarra..." required><div class="flex gap-2"><button type="button" class="btn-secondary" style="flex:1;" onclick="setModal(null)">Cancelar</button><button type="submit" class="btn-primary" style="flex:1;">Crear</button></div></form></div></div>`;
    if (activeModal === 'shop') modalHtml = `<div class="modal-backdrop"><div class="modal-box"><h3 class="font-bold mb-3">Nueva Recompensa</h3><form onsubmit="addReward(event)" class="flex-col gap-3"><input type="text" id="new-reward-name" placeholder="Nombre del premio" required><input type="number" id="new-reward-cost" min="1" placeholder="Precio en Coins" required><div class="flex gap-2"><button type="button" class="btn-secondary" style="flex:1;" onclick="setModal(null)">Cancelar</button><button type="submit" class="btn-primary" style="flex:1;">Crear</button></div></form></div></div>`;

    const navItems = [
      { id: 'habitos', ic: '✅', tx: 'Hábitos' },
      { id: 'deporte', ic: '💪', tx: 'Deporte' },
      { id: 'habilidades', ic: '🧠', tx: 'Habilidades' },
      { id: 'tienda', ic: '🛒', tx: 'Tienda' },
      { id: 'perfil', ic: '👤', tx: 'Perfil' },
      { id: 'ajustes', ic: '⚙️', tx: 'Ajustes' }
    ];

    root.innerHTML = `
      <header class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="font-extrabold" style="font-size:1.35rem;letter-spacing:-1px;color:var(--accent);">EVO</span>
          <span class="text-xs text-muted">${league.icon} ${league.name}</span>
        </div>
        <div class="flex items-center gap-1">
          <button class="badge-pill music-toggle ${musicPlaying ? 'playing' : ''}" onclick="toggleMusic()" title="Música de fondo">
            ${musicPlaying ? '🔊 ON' : '🎵 OFF'}
          </button>
          <div class="badge-pill">🔥 ${state.streak}</div>
          <div class="badge-pill"><span class="text-accent">⚡</span> ${state.xp}</div>
          <div class="badge-pill"><span class="text-amber">🪙</span> ${state.coins}</div>
        </div>
      </header>
      <main>${content}</main>
      <nav>${navItems.map(n => `<button class="nav-btn ${activeTab === n.id ? 'active' : ''}" onclick="setTab('${n.id}')"><span class="icon">${n.ic}</span><span>${n.tx}</span></button>`).join('')}</nav>
      ${modalHtml}
    `;
  }

  loadState();
  if (state.user) currentView = 'login';
  render();
</script>
</body>
</html>
