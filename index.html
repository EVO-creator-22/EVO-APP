<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVO — Personal Life OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            evo: {
              bg: '#09090b',
              card: '#121215',
              surface: '#18181c',
              border: '#27272a',
              accent: '#f4f4f5',
              muted: '#a1a1aa'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
    .glass-panel {
      background: rgba(18, 18, 21, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid #27272a;
    }
    .app-card {
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.25s ease;
    }
    .app-card:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: #52525b;
      background-color: #18181c;
      box-shadow: 0 14px 30px -12px rgba(0, 0, 0, 0.75);
    }
    .app-card:active, button:active {
      transform: scale(0.97);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes coinPopFloat {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); }
      20% { opacity: 1; transform: translate(-50%, -6px) scale(1.08); }
      80% { opacity: 1; transform: translate(-50%, -32px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -48px) scale(0.95); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.25); }
      50% { box-shadow: 0 0 18px 2px rgba(251, 191, 36, 0.35); }
    }
    .animate-fade {
      animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .coin-float {
      animation: coinPopFloat 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .coin-glow {
      animation: pulseGlow 2.4s infinite ease-in-out;
    }
    @media (prefers-reduced-motion: reduce) {
      .animate-fade, .coin-float, .coin-glow, .app-card {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-zinc-200 selection:text-zinc-900 relative">

  <!-- AMBIENT ANIMATED BACKGROUND CANVAS -->
  <canvas id="bg-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0 opacity-0 transition-opacity duration-500"></canvas>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-xs w-full px-4 sm:px-0"></div>

  <!-- FLOATING COIN POP CONTAINER -->
  <div id="coin-pop-layer" class="fixed inset-0 pointer-events-none z-50"></div>

  <!-- MODAL CONTAINER (For custom confirmations/inputs, never using alert/confirm) -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-40 hidden items-center justify-center p-4">
    <div id="modal-box" class="bg-evo-card border border-evo-border rounded-2xl max-w-md w-full p-6 shadow-2xl animate-fade">
      <h3 id="modal-title" class="text-lg font-semibold text-white mb-2"></h3>
      <p id="modal-desc" class="text-sm text-evo-muted mb-5"></p>
      <div id="modal-actions" class="flex justify-end gap-3"></div>
    </div>
  </div>

  <!-- ==================== 1. INITIAL SETUP (FIRST TIME ONBOARDING) ==================== -->
  <div id="screen-setup" class="hidden relative z-10 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-evo-card border border-evo-border rounded-3xl p-6 sm:p-8 shadow-2xl animate-fade">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl bg-white text-black flex items-center justify-center font-bold text-lg tracking-tighter">
          EVO
        </div>
        <div>
          <h1 class="text-xl font-semibold tracking-tight text-white">Inicializar EVO</h1>
          <p class="text-xs text-evo-muted">Tu sistema operativo personal</p>
        </div>
      </div>

      <form id="form-setup" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-evo-muted mb-1.5">Tu nombre o alias</label>
          <input type="text" id="setup-name" required placeholder="Ej. Alex"
            class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-400 transition" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-evo-muted mb-1.5">Fecha de nacimiento</label>
            <input type="date" id="setup-dob" required
              class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-400 transition" />
          </div>
          <div>
            <label class="block text-xs font-medium text-evo-muted mb-1.5">Edad confirmada</label>
            <input type="number" id="setup-age" required min="10" max="99" placeholder="Ej. 15"
              class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-400 transition" />
          </div>
        </div>

        <div id="setup-bday-preview" class="hidden bg-evo-surface/70 border border-evo-border rounded-xl p-3 text-xs text-zinc-300 flex items-center justify-between">
          <span>🎂 Cumpleaños detectado:</span>
          <span id="setup-bday-text" class="font-medium text-white"></span>
        </div>

        <div>
          <label class="block text-xs font-medium text-evo-muted mb-1.5">Contraseña / PIN de acceso</label>
          <input type="password" id="setup-pass" required minlength="4" placeholder="Mínimo 4 caracteres"
            class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-400 transition" />
        </div>

        <div>
          <label class="block text-xs font-medium text-evo-muted mb-1.5">Confirmar contraseña</label>
          <input type="password" id="setup-pass-confirm" required minlength="4" placeholder="Repite tu contraseña"
            class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-400 transition" />
        </div>

        <p id="setup-error" class="text-xs text-red-400 hidden"></p>

        <button type="submit"
          class="w-full mt-2 bg-white hover:bg-zinc-200 text-black font-semibold text-sm py-3.5 rounded-xl transition cursor-pointer">
          Crear mi espacio EVO →
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== 2. LOCK SCREEN ==================== -->
  <div id="screen-lock" class="hidden relative z-10 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-evo-card border border-evo-border rounded-3xl p-7 text-center shadow-2xl animate-fade">
      <div class="w-12 h-12 rounded-2xl bg-white text-black flex items-center justify-center font-bold text-xl tracking-tighter mx-auto mb-4">
        EVO
      </div>
      <h2 class="text-lg font-semibold text-white" id="lock-greeting">Hola de nuevo</h2>
      <p class="text-xs text-evo-muted mt-1 mb-6">Introduce tu contraseña para desbloquear</p>

      <form id="form-unlock" class="space-y-4">
        <input type="password" id="unlock-pass" required placeholder="Contraseña"
          class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-center text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-400 transition" />
        <p id="unlock-error" class="text-xs text-red-400 hidden">Contraseña incorrecta</p>
        <button type="submit"
          class="w-full bg-white hover:bg-zinc-200 text-black font-semibold text-sm py-3 rounded-xl transition cursor-pointer">
          Desbloquear
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== 3. MAIN EVO OS SHELL ==================== -->
  <div id="screen-main" class="hidden relative z-10 flex-1 flex flex-col">
    <!-- TOP BAR -->
    <header class="sticky top-0 z-30 glass-panel border-b border-evo-border">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2 sm:gap-3">
        <!-- Brand & Home button -->
        <div class="flex items-center gap-2.5 min-w-0">
          <button onclick="navigateTo('hub')" class="flex items-center gap-2.5 group cursor-pointer focus:outline-none min-w-0">
            <div class="w-9 h-9 rounded-xl bg-white text-black flex-shrink-0 flex items-center justify-center font-bold text-sm tracking-tighter group-hover:scale-105 transition">
              EVO
            </div>
            <div class="text-left truncate">
              <span id="header-username" class="block text-sm font-semibold text-white leading-none truncate">EVO OS</span>
              <span id="header-league" class="block text-[11px] text-emerald-400 mt-1 truncate">🥉 Bronce · 0 XP</span>
            </div>
          </button>
        </div>

        <!-- Right Stats, Visual/Audio Controls & Lock -->
        <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
          <button onclick="toggleAnimatedBg()" id="btn-bg-toggle" title="Activar/Desactivar fondo animado"
            class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-evo-surface hover:bg-zinc-800 border border-evo-border text-xs text-evo-muted hover:text-white transition cursor-pointer">
            <span id="bg-icon">✦</span>
            <span class="hidden md:inline text-[11px]">Fondo</span>
          </button>

          <button onclick="toggleBgMusic()" id="btn-music-toggle" title="Música ambiental Lo-Fi / Synth"
            class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-evo-surface hover:bg-zinc-800 border border-evo-border text-xs text-evo-muted hover:text-white transition cursor-pointer">
            <span id="music-icon">♪</span>
            <span id="music-status-label" class="hidden lg:inline text-[11px]">Música</span>
          </button>

          <button onclick="toggleSfx()" id="btn-sfx-toggle" title="Efectos de sonido"
            class="p-2 rounded-xl bg-evo-surface hover:bg-zinc-800 border border-evo-border text-xs text-white transition cursor-pointer">
            <span id="sfx-icon">🔊</span>
          </button>

          <button onclick="navigateTo('tienda')" title="Ir a la Tienda EVO"
            class="coin-glow flex items-center gap-1.5 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 px-2.5 sm:px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer">
            <span>🪙</span>
            <span id="header-coins">0</span>
            <span class="hidden sm:inline text-amber-400/80 font-normal">EVO</span>
          </button>

          <button onclick="lockApp()" title="Bloquear EVO"
            class="p-2 rounded-xl bg-evo-surface hover:bg-zinc-800 border border-evo-border text-evo-muted hover:text-white transition cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT VIEWPORT -->
    <main id="app-viewport" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
      <!-- Dynamic Content Injected Here -->
    </main>

    <!-- MOBILE BOTTOM BAR -->
    <nav class="md:hidden sticky bottom-0 z-30 glass-panel border-t border-evo-border px-2 py-2 flex justify-around items-center">
      <button onclick="navigateTo('hub')" class="flex flex-col items-center p-1.5 text-[11px] text-evo-muted hover:text-white">
        <span class="text-base">⊞</span><span>Apps</span>
      </button>
      <button onclick="navigateTo('misiones')" class="flex flex-col items-center p-1.5 text-[11px] text-evo-muted hover:text-white">
        <span class="text-base">⚑</span><span>Misiones</span>
      </button>
      <button onclick="navigateTo('habitos')" class="flex flex-col items-center p-1.5 text-[11px] text-evo-muted hover:text-white">
        <span class="text-base">✓</span><span>Hábitos</span>
      </button>
      <button onclick="navigateTo('tienda')" class="flex flex-col items-center p-1.5 text-[11px] text-amber-300">
        <span class="text-base">🪙</span><span>Tienda</span>
      </button>
      <button onclick="navigateTo('ranking')" class="flex flex-col items-center p-1.5 text-[11px] text-evo-muted hover:text-white">
        <span class="text-base">🏆</span><span>Ligas</span>
      </button>
    </nav>
  </div>

  <script>
    // ==================== STATE MANAGEMENT & STORAGE ====================
    const STORAGE_KEY = 'evo_os_data_v2';

    const LEAGUES = [
      { id: 'bronce', name: 'Bronce', icon: '🥉', minXp: 0, color: 'text-amber-600', badgeBg: 'bg-amber-900/20 border-amber-700/40 text-amber-400' },
      { id: 'plata', name: 'Plata', icon: '🥈', minXp: 250, color: 'text-zinc-300', badgeBg: 'bg-zinc-700/30 border-zinc-500/40 text-zinc-200' },
      { id: 'oro', name: 'Oro', icon: '🥇', minXp: 700, color: 'text-amber-400', badgeBg: 'bg-amber-500/15 border-amber-400/40 text-amber-300' },
      { id: 'platino', name: 'Platino', icon: '💠', minXp: 1500, color: 'text-cyan-300', badgeBg: 'bg-cyan-500/15 border-cyan-400/40 text-cyan-300' },
      { id: 'diamante', name: 'Diamante', icon: '💎', minXp: 3000, color: 'text-sky-300', badgeBg: 'bg-sky-500/15 border-sky-400/40 text-sky-300' },
      { id: 'maestro', name: 'Maestro', icon: '⚔️', minXp: 6000, color: 'text-emerald-300', badgeBg: 'bg-emerald-500/15 border-emerald-400/40 text-emerald-300' },
      { id: 'leyenda', name: 'Leyenda EVO', icon: '👑', minXp: 12000, color: 'text-amber-300', badgeBg: 'bg-amber-400/20 border-amber-300/50 text-amber-200' }
    ];

    const DEFAULT_STATE = {
      initialized: false,
      user: {
        name: '',
        dob: '',
        age: 15,
        password: '',
        coins: 50,
        xp: 0
      },
      visual: {
        animatedBg: true
      },
      audio: {
        sfxEnabled: true,
        musicEnabled: false,
        musicStyle: 'lofi',
        musicVolume: 0.25
      },
      rewardsConfig: {
        habit: 15,
        studyPomodoro: 25,
        workout: 35,
        skillPractice: 20
      },
      apps: {
        perfil: {
          onboarded: true,
          bio: 'Construyendo mi mejor versión día a día.',
          mainGoal: 'Subir notas, mejorar físico y dominar finanzas.'
        },
        negocios: {
          onboarded: false,
          financialGoal: 500,
          monthlyGoal: 150,
          capital: 0,
          products: [],
          transactions: []
        },
        estudio: {
          onboarded: false,
          subjects: ['Matemáticas', 'Inglés', 'Catalán', 'Física y Química'],
          targetGrade: 8.5,
          tasks: [],
          grades: [],
          flashcards: [],
          pomodorosCompleted: 0,
          studyMinutes: 0
        },
        deporte: {
          onboarded: false,
          weeklyGoal: 3,
          focus: 'Fuerza y resistencia',
          waterGlasses: 0,
          recoveryScore: 8,
          sessions: []
        },
        habitos: {
          onboarded: false,
          list: []
        },
        habilidades: {
          onboarded: false,
          list: []
        },
        diario: {
          onboarded: true,
          entries: []
        },
        misiones: {
          onboarded: true,
          dailyMissions: [
            { id: 'm1', title: 'Completar 2 bloques de estudio o lectura', xp: 40, coins: 20, lastCompleted: null },
            { id: 'm2', title: 'Cumplir al menos 3 hábitos diarios', xp: 35, coins: 15, lastCompleted: null },
            { id: 'm3', title: 'Registrar progreso en Diario o Deporte', xp: 30, coins: 15, lastCompleted: null }
          ],
          projects: [
            {
              id: 'proj_1',
              title: 'Aprobar todos los Globales con nota',
              deadline: 'Esta semana',
              subtasks: [
                { id: 'st1', title: 'Repasar fórmulas y ejercicios clave', done: false },
                { id: 'st2', title: 'Hacer 3 sesiones Pomodoro de repaso', done: false }
              ]
            }
          ],
          quickTasks: []
        },
        biblioteca: {
          onboarded: true,
          books: [
            { id: 'b1', title: 'Hábitos Atómicos', author: 'James Clear', status: 'reading', currentPage: 45, totalPages: 320, rating: 5, notes: 'Mejorar un 1% cada día marca la diferencia a largo plazo.' }
          ]
        },
        ranking: {
          onboarded: true,
          friends: [
            { id: 'f1', name: 'Marc B.', xp: 820, streak: 9 },
            { id: 'f2', name: 'Carla R.', xp: 410, streak: 5 },
            { id: 'f3', name: 'Dani V.', xp: 1650, streak: 14 },
            { id: 'f4', name: 'Sofía M.', xp: 190, streak: 3 }
          ]
        },
        juegos: {
          onboarded: true,
          bestMemory: 0,
          bestMath: 0,
          bestReaction: null,
          dailyRewardDate: null
        },
        tienda: {
          onboarded: true,
          items: [
            { id: 'r1', title: '1 hora libre de ocio / videojuegos', cost: 60, category: 'Ocio', icon: '🎮' },
            { id: 'r2', title: 'Capricho o snack favorito', cost: 80, category: 'Comida', icon: '🍫' },
            { id: 'r3', title: 'Compra personal (hasta 15€)', cost: 250, category: 'Compra', icon: '🛍️' },
            { id: 'r4', title: 'Día sin tareas extra / descanso total', cost: 150, category: 'Descanso', icon: '🔋' }
          ],
          history: []
        },
        configuracion: {
          onboarded: true
        }
      }
    };

    let state = loadState();
    let currentView = 'hub';
    let pomodoroInterval = null;
    let pomodoroSeconds = 25 * 60;
    let pomodoroMode = 'focus';
    let pomodoroRunning = false;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('evo_os_state_v1');
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        return {
          ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
          ...parsed,
          user: { ...DEFAULT_STATE.user, ...(parsed.user || {}) },
          visual: { ...DEFAULT_STATE.visual, ...(parsed.visual || {}) },
          audio: { ...DEFAULT_STATE.audio, ...(parsed.audio || {}) },
          rewardsConfig: { ...DEFAULT_STATE.rewardsConfig, ...(parsed.rewardsConfig || {}) },
          apps: {
            perfil: { ...DEFAULT_STATE.apps.perfil, ...(parsed.apps?.perfil || {}) },
            negocios: { ...DEFAULT_STATE.apps.negocios, ...(parsed.apps?.negocios || {}) },
            estudio: { ...DEFAULT_STATE.apps.estudio, ...(parsed.apps?.estudio || {}) },
            deporte: { ...DEFAULT_STATE.apps.deporte, ...(parsed.apps?.deporte || {}) },
            habitos: { ...DEFAULT_STATE.apps.habitos, ...(parsed.apps?.habitos || {}) },
            habilidades: { ...DEFAULT_STATE.apps.habilidades, ...(parsed.apps?.habilidades || {}) },
            diario: { ...DEFAULT_STATE.apps.diario, ...(parsed.apps?.diario || {}) },
            misiones: { ...DEFAULT_STATE.apps.misiones, ...(parsed.apps?.misiones || {}) },
            biblioteca: { ...DEFAULT_STATE.apps.biblioteca, ...(parsed.apps?.biblioteca || {}) },
            ranking: { ...DEFAULT_STATE.apps.ranking, ...(parsed.apps?.ranking || {}) },
            juegos: { ...DEFAULT_STATE.apps.juegos, ...(parsed.apps?.juegos || {}) },
            tienda: { ...DEFAULT_STATE.apps.tienda, ...(parsed.apps?.tienda || {}) },
            configuracion: { ...DEFAULT_STATE.apps.configuracion, ...(parsed.apps?.configuracion || {}) }
          }
        };
      } catch (e) {
        console.error('Error loading EVO state:', e);
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    // ==================== ANIMATED AMBIENT CANVAS ENGINE ====================
    const BgEngine = {
      canvas: null,
      ctx: null,
      particles: [],
      animId: null,
      running: false,

      init() {
        this.canvas = document.getElementById('bg-canvas');
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.createParticles();
        this.syncState();
      },

      resize() {
        if (!this.canvas) return;
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      },

      createParticles() {
        const count = Math.min(48, Math.floor((window.innerWidth * window.innerHeight) / 26000));
        this.particles = Array.from({ length: Math.max(18, count) }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 1.6 + 0.6
        }));
      },

      syncState() {
        if (!this.canvas) return;
        if (state.visual.animatedBg) {
          this.canvas.classList.remove('opacity-0');
          this.canvas.classList.add('opacity-100');
          if (!this.running) this.start();
        } else {
          this.canvas.classList.remove('opacity-100');
          this.canvas.classList.add('opacity-0');
          this.stop();
        }
        const btn = document.getElementById('btn-bg-toggle');
        if (btn) {
          if (state.visual.animatedBg) {
            btn.classList.add('border-cyan-500/40', 'text-cyan-300', 'bg-cyan-500/10');
          } else {
            btn.classList.remove('border-cyan-500/40', 'text-cyan-300', 'bg-cyan-500/10');
          }
        }
      },

      start() {
        if (this.running) return;
        this.running = true;
        const loop = () => {
          if (!this.running) return;
          this.draw();
          this.animId = requestAnimationFrame(loop);
        };
        loop();
      },

      stop() {
        this.running = false;
        if (this.animId) {
          cancelAnimationFrame(this.animId);
          this.animId = null;
        }
      },

      draw() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        ctx.clearRect(0, 0, w, h);

        // Subtle radial ambient glow
        const grad = ctx.createRadialGradient(w * 0.5, h * 0.15, 20, w * 0.5, h * 0.25, Math.max(w, h) * 0.65);
        grad.addColorStop(0, 'rgba(16, 185, 129, 0.05)');
        grad.addColorStop(0.5, 'rgba(6, 182, 212, 0.025)');
        grad.addColorStop(1, 'rgba(9, 9, 11, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // Update & draw particles + subtle constellation lines
        for (let i = 0; i < this.particles.length; i++) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(212, 212, 216, 0.28)';
          ctx.fill();

          for (let j = i + 1; j < this.particles.length; j++) {
            const p2 = this.particles[j];
            const dx = p.x - p2.x;
            const dy = p.y - p2.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 130) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(161, 161, 170, ${(1 - dist / 130) * 0.11})`;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
        }
      }
    };

    // ==================== WEB AUDIO API SOUND & MUSIC ENGINE ====================
    const SoundEngine = {
      ctx: null,
      musicTimer: null,
      stepIndex: 0,

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      },

      playClick(pitch = 520) {
        if (!state.audio.sfxEnabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(pitch * 0.65, now + 0.055);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      },

      playCoin() {
        if (!state.audio.sfxEnabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = [987.77, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const start = now + idx * 0.075;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.11, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.3);
        });
      },

      playFanfare() {
        if (!state.audio.sfxEnabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const chord = [523.25, 659.25, 783.99, 1046.5];
        chord.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const t = now + idx * 0.07;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.09, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.36);
        });
      },

      playLock(locking = true) {
        if (!state.audio.sfxEnabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        if (locking) {
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.16);
        } else {
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.16);
        }
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.19);
      },

      startMusic() {
        this.stopMusic();
        if (!state.audio.musicEnabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;

        const lofiNotes = [174.61, 220.0, 261.63, 329.63, 164.81, 196.0, 246.94, 293.66, 146.83, 174.61, 220.0, 261.63, 130.81, 196.0, 246.94, 329.63];
        const synthNotes = [220.0, 277.18, 329.63, 440.0, 196.0, 246.94, 293.66, 392.0, 174.61, 220.0, 261.63, 349.23, 164.81, 246.94, 329.63, 493.88];

        const tick = () => {
          if (!state.audio.musicEnabled || !this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});

          const notes = state.audio.musicStyle === 'synth' ? synthNotes : lofiNotes;
          const freq = notes[this.stepIndex % notes.length];
          this.stepIndex++;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = state.audio.musicStyle === 'synth' ? 'sawtooth' : 'sine';
          osc.frequency.setValueAtTime(freq, now);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(state.audio.musicStyle === 'synth' ? 950 : 620, now);

          const vol = Math.max(0.01, Math.min(0.6, state.audio.musicVolume)) * 0.14;
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.68);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.7);
        };

        tick();
        const intervalMs = state.audio.musicStyle === 'synth' ? 420 : 540;
        this.musicTimer = setInterval(tick, intervalMs);
      },

      stopMusic() {
        if (this.musicTimer) {
          clearInterval(this.musicTimer);
          this.musicTimer = null;
        }
      }
    };

    // ==================== UTILITIES, LEAGUES & GAMIFICATION ====================
    function getTodayStr() {
      return new Date().toISOString().split('T')[0];
    }

    function calculateBirthdayInfo(dobStr) {
      if (!dobStr) return { formatted: 'No definida', daysLeft: 0, exactAge: state.user.age };
      const parts = dobStr.split('-').map(Number);
      const birthYear = parts[0], birthMonth = parts[1] - 1, birthDay = parts[2];
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let exactAge = today.getFullYear() - birthYear;
      const mDiff = today.getMonth() - birthMonth;
      if (mDiff < 0 || (mDiff === 0 && today.getDate() < birthDay)) {
        exactAge--;
      }

      let nextBday = new Date(today.getFullYear(), birthMonth, birthDay);
      if (nextBday < today) {
        nextBday.setFullYear(today.getFullYear() + 1);
      }
      const diffTime = nextBday - today;
      const daysLeft = Math.round(diffTime / (1000 * 60 * 60 * 24));

      const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const formatted = `${birthDay} de ${months[birthMonth]}`;
      return { formatted, daysLeft, exactAge };
    }

    function getLeagueInfo(xp) {
      let currentIdx = 0;
      for (let i = 0; i < LEAGUES.length; i++) {
        if (xp >= LEAGUES[i].minXp) currentIdx = i;
      }
      const current = LEAGUES[currentIdx];
      const next = LEAGUES[currentIdx + 1] || null;
      let progressPct = 100;
      let xpIntoLeague = xp - current.minXp;
      let xpNeededForNext = 0;
      if (next) {
        const span = next.minXp - current.minXp;
        progressPct = Math.min(100, Math.max(0, Math.round((xpIntoLeague / span) * 100)));
        xpNeededForNext = next.minXp - xp;
      }
      return { current, next, progressPct, xpIntoLeague, xpNeededForNext, index: currentIdx };
    }

    function getLevelInfo(xp) {
      const level = Math.floor(xp / 100) + 1;
      const currentLevelXp = xp % 100;
      return { level, currentLevelXp, nextLevelXp: 100 };
    }

    function addRewards(coins, xp, reason) {
      const prevLeague = getLeagueInfo(state.user.xp).current.id;
      const prevLevel = getLevelInfo(state.user.xp).level;
      state.user.coins += coins;
      state.user.xp += xp;
      const newLeague = getLeagueInfo(state.user.xp).current;
      const newLevel = getLevelInfo(state.user.xp).level;
      saveState();
      SoundEngine.playCoin();
      spawnCoinPop(`+${coins} 🪙 · +${xp} XP`);
      showToast(`+${coins} 🪙 Coins · +${xp} XP (${reason})`, 'coin');
      if (newLeague.id !== prevLeague) {
        SoundEngine.playFanfare();
        showToast(`¡Ascenso de Liga! Ahora eres ${newLeague.icon} Liga ${newLeague.name}`, 'coin');
      } else if (newLevel > prevLevel) {
        SoundEngine.playFanfare();
        showToast(`¡Subiste al Nivel ${newLevel}!`, 'coin');
      }
    }

        return false;

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatSeconds(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function setPomodoroMode(mode) {
      clearInterval(pomodoroInterval);
      pomodoroRunning = false;
      pomodoroMode = mode;
      pomodoroSeconds = mode === 'focus' ? 25 * 60 : 5 * 60;
      if (currentView === 'estudio') renderEstudio(document.getElementById('app-viewport'));
    }

    function togglePomodoro() {
      if (pomodoroRunning) {
        clearInterval(pomodoroInterval);
        pomodoroRunning = false;
      } else {
        pomodoroRunning = true;
        pomodoroInterval = setInterval(() => {
          pomodoroSeconds--;
          const disp = document.getElementById('pomodoro-display');
          if (disp) disp.textContent = formatSeconds(pomodoroSeconds);
          if (pomodoroSeconds <= 0) {
            clearInterval(pomodoroInterval);
            pomodoroRunning = false;
            if (pomodoroMode === 'focus') {
              completePomodoroNow();
              setPomodoroMode('break');
            } else {
              showToast('Descanso terminado. ¡Vuelta al enfoque!');
              setPomodoroMode('focus');
            }
          }
        }, 1000);
      }
      const btn = document.getElementById('pomodoro-btn');
      if (btn) btn.textContent = pomodoroRunning ? 'Pausar' : 'Iniciar sesión';
    }

    function resetPomodoro() {
      setPomodoroMode(pomodoroMode);
    }

    function completePomodoroNow() {
      state.apps.estudio.pomodorosCompleted += 1;
      state.apps.estudio.studyMinutes = (state.apps.estudio.studyMinutes || 0) + 25;
      addRewards(state.rewardsConfig.studyPomodoro, 30, 'Sesión de estudio');
      if (currentView === 'estudio') renderEstudio(document.getElementById('app-viewport'));
    }

      t.done = !t.done;

      else saveState();
      renderEstudio(document.getElementById('app-viewport'));
    }

      state.apps.estudio.tasks = state.apps.estudio.tasks.filter(x => x.id !== id);

        });

      renderDeporte(document.getElementById('app-viewport'));
    }

      SoundEngine.playClick(480);
      renderDeporte(document.getElementById('app-viewport'));

    // ==================== 5. HÁBITOS ====================

      const today = getTodayStr();

            <div class="text-2xl mb-2">✓</div>
            <h2 class="text-xl font-bold text-white">Configurar tus Hábitos</h2>

            <div class="flex flex-wrap items-center justify-between gap-2">
              <form id="form-add-habit" class="flex flex-1 min-w-[240px] gap-2">

                  <option value="Mente">Mente</option>

                </button>
              </form>

              <button onclick="completeAllHabitsToday()" class="px-4 py-3 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-300 text-xs font-semibold transition cursor-pointer">
                ✓ Completar todos hoy
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              ${hab.list.length === 0 ? '<p class="text-xs text-evo-muted">No tienes hábitos creados todavía.</p>' : ''}
              ${hab.list.map(h => {
                const doneToday = h.lastCompleted === today;
                return `
                  <div class="flex items-center justify-between p-4 rounded-2xl border transition ${doneToday ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-evo-surface border-evo-border'}">
                    <div class="flex items-center gap-3">
                      <button onclick="toggleHabit(${h.id})"
                        class="w-7 h-7 rounded-xl flex items-center justify-center text-xs font-bold border transition cursor-pointer ${doneToday ? 'bg-emerald-400 text-black border-emerald-400' : 'bg-zinc-900 text-transparent border-zinc-600 hover:border-white'}">
                        ✓
                      </button>
                      <div>
                        <div class="flex items-center gap-2">
                          <p class="text-sm font-medium ${doneToday ? 'text-emerald-200' : 'text-white'}">${escapeHTML(h.title)}</p>
                          <span class="text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-evo-muted">${escapeHTML(h.category || 'General')}</span>
                        </div>

                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;

      document.getElementById('form-add-habit').addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('new-habit-title').value.trim();
        const category = document.getElementById('new-habit-cat').value;
        if (!title) return;
        hab.list.push({ id: Date.now(), title, category, streak: 0, lastCompleted: null });
        saveState();
        renderHabitos(container);
      });
    }

    function resetHabOnboarding() {
      state.apps.habitos.onboarded = false;
      saveState();
      renderHabitos(document.getElementById('app-viewport'));
    }

    function completeAllHabitsToday() {
      const today = getTodayStr();
      let completedCount = 0;
      state.apps.habitos.list.forEach(h => {
        if (h.lastCompleted !== today) {
          h.lastCompleted = today;
          h.streak += 1;
          completedCount++;
        }
      });
      if (completedCount === 0) {
        showToast('Todos los hábitos de hoy ya estaban completados');
        return;
      }
      addRewards(completedCount * state.rewardsConfig.habit, completedCount * 15, `${completedCount} hábitos completados`);
      renderHabitos(document.getElementById('app-viewport'));
    }

    function toggleHabit(id) {
      const h = state.apps.habitos.list.find(x => x.id === id);
      if (!h) return;
      const today = getTodayStr();
      if (h.lastCompleted === today) {
        showToast('Este hábito ya está completado hoy');
        return;
      }
      h.lastCompleted = today;
      h.streak += 1;
      addRewards(state.rewardsConfig.habit, 15, `Hábito: ${h.title}`);
      renderHabitos(document.getElementById('app-viewport'));
    }

    function deleteHabit(id) {
      state.apps.habitos.list = state.apps.habitos.list.filter(x => x.id !== id);
      saveState();
      renderHabitos(document.getElementById('app-viewport'));
    }

          renderHabilidades(container);

        <div class="animate-fade space-y-6">
          ${appHeaderHTML('Habilidades', `Practica y suma minutos para subir nivel · +${state.rewardsConfig.skillPractice} 🪙 por sesión`, '❖', 'resetSkOnboarding()')}

          <div class="bg-evo-card border border-evo-border rounded-3xl p-6 space-y-5">
            <form id="form-add-skill" class="flex gap-2">
              <input type="text" id="new-skill-name" required placeholder="Nueva habilidad (ej. Inglés hablado, Diseño, Oratoria...)"

              </button>

                const lvl = Math.floor(item.xp / 100) + 1;
                const pct = item.xp % 100;
                const mins = item.minutes || 0;
                return `
                  <div class="bg-evo-surface border border-evo-border rounded-2xl p-5 flex flex-col justify-between space-y-4">
                    <div>
                      <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-semibold text-amber-300">Nivel ${lvl} · ${mins} min</span>
                        <button onclick="deleteSkill(${item.id})" class="text-zinc-500 hover:text-red-400 text-xs cursor-pointer">✕</button>
                      </div>
                      <h3 class="text-base font-bold text-white">${escapeHTML(item.name)}</h3>
                      <div class="w-full h-2 bg-zinc-800 rounded-full overflow-hidden mt-3">

                      </div>

                      <button onclick="practiceSkill(${item.id}, 45)"
                        class="py-2.5 rounded-xl bg-white hover:bg-zinc-200 text-black font-semibold text-xs transition cursor-pointer">

              }).join('')}

        if (!name) return;
        sk.list.push({ id: Date.now(), name, xp: 0, minutes: 0 });
        saveState();
        renderHabilidades(container);
      });

      state.apps.habilidades.onboarded = false;
      saveState();
      renderHabilidades(document.getElementById('app-viewport'));
    }

    function practiceSkill(id, mins = 25) {
      const s = state.apps.habilidades.list.find(x => x.id === id);
      if (!s) return;
      s.minutes = (s.minutes || 0) + mins;
      s.xp += mins >= 40 ? 45 : 25;
      const coinBonus = mins >= 40 ? state.rewardsConfig.skillPractice : Math.max(10, Math.round(state.rewardsConfig.skillPractice * 0.6));
      addRewards(coinBonus, mins >= 40 ? 35 : 20, `${s.name} (+${mins}m)`);
      renderHabilidades(document.getElementById('app-viewport'));
    }

      state.apps.habilidades.list = state.apps.habilidades.list.filter(x => x.id !== id);
      saveState();
      renderHabilidades(document.getElementById('app-viewport'));

                  const total = proj.subtasks.length;
                  const doneCount = proj.subtasks.filter(s => s.done).length;

                      </div>
                      <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                        <div class="h-full bg-cyan-400 rounded-full transition-all" style="width: ${pct}%"></div>
                      </div>
                      <div class="space-y-1.5">

                            </span>
                            <span class="${st.done ? 'line-through text-zinc-500' : 'text-zinc-200'}">${escapeHTML(st.title)}</span>

                      <form onsubmit="addProjectSubtask(event, '${proj.id}')" class="flex gap-2 pt-1">

              <div class="space-y-2 max-h-96 overflow-y-auto">

                          ${qt.done ? '✓' : ''}
                        </span>
                        <div>
                          <p class="${qt.done ? 'line-through text-zinc-500' : 'text-white font-medium'}">${escapeHTML(qt.title)}</p>

                        </div>
                      </button>
                      <button onclick="deleteQuickTask(${qt.id})" class="text-zinc-500 hover:text-red-400 px-1 cursor-pointer">✕</button>

          </div>

      document.getElementById('form-project-add').addEventListener('submit', (e) => {
        e.preventDefault();

          id: 'proj_' + Date.now(),
          title: document.getElementById('proj-title').value.trim(),
          deadline: document.getElementById('proj-deadline').value.trim() || 'Sin fecha',
          subtasks: []
        });
        saveState();
        renderMisiones(container);
      });

      document.getElementById('form-quick-task').addEventListener('submit', (e) => {
        e.preventDefault();
        mis.quickTasks.push({
          id: Date.now(),
          title: document.getElementById('qt-title').value.trim(),
          priority: document.getElementById('qt-priority').value,
          done: false
        });
        saveState();
        renderMisiones(container);
      });

    function completeDailyMission(id) {
      const m = state.apps.misiones.dailyMissions.find(x => x.id === id);
      if (!m) return;
      const today = getTodayStr();
      if (m.lastCompleted === today) return;
      m.lastCompleted = today;
      addRewards(m.coins, m.xp, `Misión: ${m.title}`);
      renderMisiones(document.getElementById('app-viewport'));
    }

    function addProjectSubtask(e, projId) {
      e.preventDefault();
      const input = document.getElementById(`sub-input-${projId}`);
      const title = input.value.trim();
      if (!title) return;
      const proj = state.apps.misiones.projects.find(p => p.id === projId);
      if (!proj) return;
      proj.subtasks.push({ id: 'st_' + Date.now(), title, done: false });
      saveState();
      renderMisiones(document.getElementById('app-viewport'));
    }

    function toggleProjectSubtask(projId, stId) {
      const proj = state.apps.misiones.projects.find(p => p.id === projId);
      if (!proj) return;
      const st = proj.subtasks.find(s => s.id === stId);
      if (!st) return;
      st.done = !st.done;
      if (st.done) addRewards(10, 15, 'Paso de proyecto completado');
      else saveState();
      renderMisiones(document.getElementById('app-viewport'));
    }

    function deleteProject(projId) {
      state.apps.misiones.projects = state.apps.misiones.projects.filter(p => p.id !== projId);
      saveState();
      renderMisiones(document.getElementById('app-viewport'));
    }

    function toggleQuickTask(id) {
      const qt = state.apps.misiones.quickTasks.find(x => x.id === id);
      if (!qt) return;
      qt.done = !qt.done;
      if (qt.done) addRewards(8, 10, 'Tarea completada');
      else saveState();
      renderMisiones(document.getElementById('app-viewport'));
    }

    function deleteQuickTask(id) {
      state.apps.misiones.quickTasks = state.apps.misiones.quickTasks.filter(x => x.id !== id);
      saveState();
      renderMisiones(document.getElementById('app-viewport'));
    }

                          <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden">

                            +15 págs (+10 🪙)
                          </button>
                          <button onclick="finishBook('${b.id}')" class="px-3 py-2 rounded-xl bg-emerald-400 hover:bg-emerald-300 text-black text-xs font-semibold cursor-pointer">

                }).join('')}
              </div>
            </div>
          </div>
        </div>

      document.getElementById('form-book-add').addEventListener('submit', (e) => {
        e.preventDefault();
        const status = document.getElementById('book-status').value;
        const total = parseInt(document.getElementById('book-total').value, 10) || 200;
        bib.books.push({
          id: 'b_' + Date.now(),
          title: document.getElementById('book-title').value.trim(),
          author: document.getElementById('book-author').value.trim(),
          status,
          currentPage: status === 'completed' ? total : 0,
          totalPages: total,
          notes: document.getElementById('book-notes').value.trim()
        });
        saveState();
        renderBiblioteca(container);
      });
    }

    function logReadingPages(id, pages) {
      const b = state.apps.biblioteca.books.find(x => x.id === id);
      if (!b) return;
      b.status = 'reading';
      b.currentPage = Math.min(b.totalPages, (b.currentPage || 0) + pages);
      if (b.currentPage >= b.totalPages) {
        b.status = 'completed';
        addRewards(40, 50, `Libro terminado: ${b.title}`);
      } else {
        addRewards(10, 15, `Lectura: ${b.title}`);
      }
      renderBiblioteca(document.getElementById('app-viewport'));
    }

    function finishBook(id) {
      const b = state.apps.biblioteca.books.find(x => x.id === id);
      if (!b) return;
      b.currentPage = b.totalPages;
      b.status = 'completed';
      addRewards(40, 50, `Libro completado: ${b.title}`);
      renderBiblioteca(document.getElementById('app-viewport'));
    }

    function deleteBook(id) {
      state.apps.biblioteca.books = state.apps.biblioteca.books.filter(x => x.id !== id);
      saveState();
      renderBiblioteca(document.getElementById('app-viewport'));
    }

              <button id="mem-cell-${i}" onclick="handleMemoryTap(${i})"
                class="h-20 rounded-2xl bg-evo-surface border border-evo-border hover:border-zinc-500 transition-all duration-150 cursor-pointer"></button>
            `).join('')}
          </div>

          <button onclick="startMemoryGame()" class="px-6 py-3 rounded-xl bg-white hover:bg-zinc-200 text-black font-semibold text-xs cursor-pointer">
            Iniciar / Reiniciar secuencia
          </button>
        </div>
      `;
    }

    function startMemoryGame() {
      memSequence = [];
      memScore = 0;
      nextMemoryRound();
    }

    function nextMemoryRound() {
      memUserStep = 0;
      memPlaying = true;
      memSequence.push(Math.floor(Math.random() * 9));
      const roundEl = document.getElementById('mem-round');
      const statusEl = document.getElementById('mem-status');
      if (roundEl) roundEl.textContent = memSequence.length;
      if (statusEl) statusEl.textContent = 'Observa con atención...';

      memSequence.forEach((cellIdx, step) => {
        setTimeout(() => {
          flashMemoryCell(cellIdx);
          if (step === memSequence.length - 1) {
            setTimeout(() => {
              memPlaying = false;
              const st = document.getElementById('mem-status');
              if (st) st.textContent = '¡Tu turno! Repite el patrón';
            }, 450);
          }
        }, (step + 1) * 550);
      });
    }

    function flashMemoryCell(idx) {
      const cell = document.getElementById(`mem-cell-${idx}`);
      if (!cell) return;
      SoundEngine.playClick(420 + idx * 45);
      cell.classList.add('bg-cyan-400', 'border-cyan-200', 'scale-95');
      setTimeout(() => {
        cell.classList.remove('bg-cyan-400', 'border-cyan-200', 'scale-95');
      }, 320);
    }

    function handleMemoryTap(idx) {
      if (memPlaying || memSequence.length === 0) return;
      flashMemoryCell(idx);
      if (idx === memSequence[memUserStep]) {
        memUserStep++;
        if (memUserStep === memSequence.length) {
          memScore = memSequence.length;
          if (memScore > state.apps.juegos.bestMemory) {
            state.apps.juegos.bestMemory = memScore;
            saveState();
          }
          if (memScore >= 3) grantDailyGameBonus();
          const st = document.getElementById('mem-status');
          if (st) st.textContent = '¡Correcto! Siguiente nivel...';
          setTimeout(nextMemoryRound, 700);
        }
      } else {
        SoundEngine.playClick(180);
        const st = document.getElementById('mem-status');
        if (st) st.textContent = `Fallo en ronda ${memSequence.length}. Pulsa Iniciar.`;
        memSequence = [];
      }
    }

    // --- Mini-Game 2: Speed Math ---
    function renderMathGame(stage) {
      stage.innerHTML = `
        <div class="text-center space-y-5">
          <div class="flex justify-between items-center text-xs">
            <span class="text-evo-muted">Récord: <strong class="text-white">${state.apps.juegos.bestMath} pts</strong></span>
            <span id="math-timer" class="font-mono font-bold text-amber-300">20s</span>
            <span class="text-evo-muted">Puntos: <strong id="math-score" class="text-white">0</strong></span>
          </div>

          <div id="math-question" class="text-3xl font-bold text-white py-6 bg-evo-surface border border-evo-border rounded-2xl">
            ¿Listo?
          </div>

          <form onsubmit="submitMathAnswer(event)" class="flex max-w-xs mx-auto gap-2">
            <input type="number" id="math-input" placeholder="Respuesta"
              class="flex-1 bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-center text-sm text-white" />
            <button type="submit" class="px-5 py-3 rounded-xl bg-white text-black font-semibold text-xs cursor-pointer">OK</button>
          </form>

          <button onclick="startMathGame()" class="px-6 py-2.5 rounded-xl bg-evo-surface hover:bg-zinc-800 border border-evo-border text-xs text-white cursor-pointer">
            Empezar partida (20s)
          </button>
        </div>
      `;
    }

    function startMathGame() {
      clearInterval(mathTimer);
      mathScore = 0;
      mathTimeLeft = 20;
      document.getElementById('math-score').textContent = '0';
      nextMathQuestion();
      document.getElementById('math-input').focus();

      mathTimer = setInterval(() => {
        mathTimeLeft--;
        const tEl = document.getElementById('math-timer');
        if (tEl) tEl.textContent = `${mathTimeLeft}s`;
        if (mathTimeLeft <= 0) {
          clearInterval(mathTimer);
          document.getElementById('math-question').textContent = `Fin: ${mathScore} puntos`;
          if (mathScore > state.apps.juegos.bestMath) {
            state.apps.juegos.bestMath = mathScore;
            saveState();
          }
          if (mathScore >= 5) grantDailyGameBonus();
        }
      }, 1000);
    }

    function nextMathQuestion() {
      const a = Math.floor(Math.random() * 18) + 4;
      const b = Math.floor(Math.random() * 15) + 3;
      const isPlus = Math.random() > 0.4;
      mathAnswer = isPlus ? a + b : a * b;
      const qEl = document.getElementById('math-question');
      if (qEl) qEl.textContent = `${a} ${isPlus ? '+' : '×'} ${b}`;
    }

    function submitMathAnswer(e) {
      e.preventDefault();
      if (mathTimeLeft <= 0) return;
      const inp = document.getElementById('math-input');
      const val = parseInt(inp.value, 10);
      inp.value = '';
      if (val === mathAnswer) {
        mathScore++;
        SoundEngine.playClick(720);
        document.getElementById('math-score').textContent = mathScore;
        nextMathQuestion();
      } else {
        SoundEngine.playClick(200);
      }
    }

    // --- Mini-Game 3: Reaction Time ---
    function renderReactionGame(stage) {
      const best = state.apps.juegos.bestReaction;
      stage.innerHTML = `
        <div class="text-center space-y-5">
          <div class="flex justify-between items-center text-xs">
            <span class="text-evo-muted">Mejor tiempo: <strong class="text-emerald-400">${best ? best + ' ms' : '—'}</strong></span>
            <span class="text-evo-muted">Pulsa cuando cambie a verde</span>
          </div>

          <button id="react-pad" onclick="handleReactionClick()"
            class="w-full h-48 rounded-2xl bg-evo-surface border border-evo-border flex flex-col items-center justify-center gap-2 transition cursor-pointer">
            <span id="react-main-text" class="text-lg font-bold text-white">Pulsa aquí para empezar</span>
            <span id="react-sub-text" class="text-xs text-evo-muted">Mide tu velocidad de reacción</span>
          </button>
        </div>
      `;
    }

    function handleReactionClick() {
      const pad = document.getElementById('react-pad');
      const mainT = document.getElementById('react-main-text');
      const subT = document.getElementById('react-sub-text');
      if (!pad) return;

      if (reactState === 'idle') {
        reactState = 'waiting';
        pad.className = 'w-full h-48 rounded-2xl bg-amber-500/20 border border-amber-400/50 flex flex-col items-center justify-center gap-2 cursor-pointer';
        mainT.textContent = 'Espera al verde...';
        subT.textContent = 'No pulses todavía';
        const delay = 1400 + Math.random() * 2400;
        reactTimeout = setTimeout(() => {
          reactState = 'ready';
          reactStartTime = performance.now();
          SoundEngine.playClick(820);
          pad.className = 'w-full h-48 rounded-2xl bg-emerald-400 text-black flex flex-col items-center justify-center gap-2 cursor-pointer';
          mainT.className = 'text-xl font-bold text-black';
          mainT.textContent = '¡PULSA AHORA!';
          subT.className = 'text-xs text-black/80';
          subT.textContent = '¡Ya!';
        }, delay);
      } else if (reactState === 'waiting') {
        clearTimeout(reactTimeout);
        reactState = 'idle';
        pad.className = 'w-full h-48 rounded-2xl bg-red-500/20 border border-red-500/40 flex flex-col items-center justify-center gap-2 cursor-pointer';
        mainT.textContent = 'Demasiado pronto';
        subT.textContent = 'Pulsa para intentarlo de nuevo';
      } else if (reactState === 'ready') {
        const diff = Math.round(performance.now() - reactStartTime);
        reactState = 'idle';
        if (!state.apps.juegos.bestReaction || diff < state.apps.juegos.bestReaction) {
          state.apps.juegos.bestReaction = diff;
          saveState();
        }
        grantDailyGameBonus();
        renderReactionGame(document.getElementById('game-stage'));
        document.getElementById('react-main-text').textContent = `${diff} ms`;
        document.getElementById('react-sub-text').textContent = 'Pulsa para repetir';
      }
    }

    // ==================== 12. TIENDA EVO ====================
    function renderTienda(container) {
      const shop = state.apps.tienda;

      container.innerHTML = `
        <div class="animate-fade space-y-6">
          ${appHeaderHTML('Tienda EVO', 'Canjea el esfuerzo de tus hábitos, estudio y entrenos por recompensas', '🪙')}

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
              <div class="bg-evo-card border border-evo-border rounded-3xl p-6">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-sm font-semibold text-white">Recompensas disponibles</h3>
                  <span class="text-xs font-semibold text-amber-300 bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-xl">
                    Saldo: 🪙 ${state.user.coins}
                  </span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  ${shop.items.map(item => {
                    const canAfford = state.user.coins >= item.cost;
                    return `
                      <div class="bg-evo-surface border border-evo-border rounded-2xl p-4 flex flex-col justify-between gap-4">
                        <div>
                          <div class="flex items-center justify-between">
                            <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded bg-zinc-800 text-evo-muted">${escapeHTML(item.icon || '🎁')} ${escapeHTML(item.category)}</span>
                            <button onclick="deleteShopItem('${item.id}')" class="text-zinc-500 hover:text-red-400 text-xs cursor-pointer">✕</button>
                          </div>
                          <h4 class="text-sm font-semibold text-white mt-2">${escapeHTML(item.title)}</h4>
                        </div>
                        <button onclick="redeemShopItem('${item.id}')"
                          class="w-full py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer ${canAfford ? 'bg-amber-400 hover:bg-amber-300 text-black' : 'bg-zinc-800 text-zinc-500'}">
                          Canjear por 🪙 ${item.cost}
                        </button>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <div class="bg-evo-card border border-evo-border rounded-3xl p-6">
                <h3 class="text-sm font-semibold text-white mb-3">Crear recompensa personalizada</h3>
                <form id="form-shop-add" class="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
                  <input type="text" id="shop-icon" value="🎁" maxlength="2"
                    class="bg-evo-surface border border-evo-border rounded-xl px-3 py-2.5 text-center text-sm text-white" />
                  <input type="text" id="shop-title" required placeholder="Ej. Comprar camiseta / Partida extra"
                    class="sm:col-span-2 bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs text-white" />
                  <input type="number" min="5" id="shop-cost" required placeholder="Precio (🪙)"
                    class="bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs text-white" />
                  <button type="submit" class="bg-white hover:bg-zinc-200 text-black font-semibold text-xs py-2.5 rounded-xl cursor-pointer">
                    + Crear
                  </button>
                </form>
              </div>
            </div>

            <div class="bg-evo-card border border-evo-border rounded-3xl p-6">
              <h3 class="text-sm font-semibold text-white mb-4">Historial de canjes</h3>
              <div class="space-y-2.5 max-h-96 overflow-y-auto">
                ${shop.history.length === 0 ? '<p class="text-xs text-evo-muted">Aún no has canjeado ninguna recompensa.</p>' : ''}
                ${shop.history.slice().reverse().map(h => `
                  <div class="bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs flex items-center justify-between">
                    <div>
                      <p class="font-medium text-white">${escapeHTML(h.title)}</p>
                      <span class="text-[10px] text-evo-muted">${escapeHTML(h.date)}</span>
                    </div>
                    <span class="text-amber-300 font-semibold">-🪙 ${h.cost}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('form-shop-add').addEventListener('submit', (e) => {
        e.preventDefault();
        const icon = (document.getElementById('shop-icon').value || '🎁').trim();
        const title = document.getElementById('shop-title').value.trim();
        const cost = parseInt(document.getElementById('shop-cost').value, 10);
        if (!title || !cost) return;
        shop.items.push({ id: 'r_' + Date.now(), icon, title, cost, category: 'Personal' });
        saveState();
        renderTienda(container);
      });
    }

    function redeemShopItem(id) {
      const item = state.apps.tienda.items.find(x => x.id === id);
      if (!item) return;
      if (!spendCoins(item.cost, item.title)) return;
      state.apps.tienda.history.push({
        title: item.title,
        cost: item.cost,
        date: new Date().toLocaleDateString('es-ES')
      });
      saveState();
      renderTienda(document.getElementById('app-viewport'));
    }

    function deleteShopItem(id) {
      state.apps.tienda.items = state.apps.tienda.items.filter(x => x.id !== id);
      saveState();
      renderTienda(document.getElementById('app-viewport'));
    }

    // ==================== 13. CONFIGURACIÓN ====================
    function renderConfiguracion(container) {
      container.innerHTML = `
        <div class="animate-fade space-y-6">
          ${appHeaderHTML('Configuración del Sistema', 'Seguridad, fondo animado, audio, monedas y copia de seguridad', '⚙')}

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-evo-card border border-evo-border rounded-3xl p-6 space-y-4">
              <h3 class="text-sm font-semibold text-white">Datos y Contraseña</h3>
              <form id="form-cfg-user" class="space-y-3">
                <div>
                  <label class="block text-xs text-evo-muted mb-1">Nombre</label>
                  <input type="text" id="cfg-name" required value="${escapeHTML(state.user.name)}"
                    class="w-full bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs text-white" />
                </div>
                <div>
                  <label class="block text-xs text-evo-muted mb-1">Fecha de nacimiento</label>
                  <input type="date" id="cfg-dob" required value="${escapeHTML(state.user.dob)}"
                    class="w-full bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs text-white" />
                </div>
                <div>
                  <label class="block text-xs text-evo-muted mb-1">Nueva contraseña (dejar igual si no cambia)</label>
                  <input type="password" id="cfg-pass" required minlength="4" value="${escapeHTML(state.user.password)}"
                    class="w-full bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs text-white" />
                </div>
                <button type="submit" class="w-full bg-white hover:bg-zinc-200 text-black font-semibold text-xs py-2.5 rounded-xl cursor-pointer">
                  Guardar cambios
                </button>
              </form>
            </div>

            <div class="bg-evo-card border border-evo-border rounded-3xl p-6 space-y-5">
              <div>
                <h3 class="text-sm font-semibold text-white mb-3">Visual, Fondo Animado y Audio</h3>
                <div class="flex items-center justify-between bg-evo-surface border border-evo-border rounded-xl p-3 mb-3">
                  <div>
                    <p class="text-xs font-medium text-white">Fondo animado de partículas</p>
                    <span class="text-[11px] text-evo-muted">Activa o desactiva la animación de fondo</span>
                  </div>
                  <button onclick="toggleAnimatedBg()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold cursor-pointer ${state.visual.animatedBg ? 'bg-cyan-400 text-black' : 'bg-zinc-800 text-zinc-400'}">
                    ${state.visual.animatedBg ? 'Activado' : 'Desactivado'}
                  </button>
                </div>

                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-[11px] text-evo-muted mb-1">Estilo musical</label>
                    <select id="cfg-music-style" onchange="updateMusicSettings()"
                      class="w-full bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white">
                      <option value="lofi" ${state.audio.musicStyle === 'lofi' ? 'selected' : ''}>Lo-Fi Relajado</option>
                      <option value="synth" ${state.audio.musicStyle === 'synth' ? 'selected' : ''}>Synth Enfoque</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-[11px] text-evo-muted mb-1">Volumen (${Math.round((state.audio.musicVolume || 0.25) * 100)}%)</label>
                    <input type="range" min="0.05" max="0.6" step="0.05" value="${state.audio.musicVolume || 0.25}"
                      onchange="updateMusicVolume(this.value)" class="w-full accent-white cursor-pointer mt-2" />
                  </div>
                </div>
              </div>

              <div class="pt-4 border-t border-evo-border">
                <h3 class="text-sm font-semibold text-white mb-3">Ajustar recompensas (EVO Coins)</h3>
                <form id="form-cfg-rewards" class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-[11px] text-evo-muted mb-1">Por hábito</label>
                    <input type="number" id="rew-habit" value="${state.rewardsConfig.habit}"
                      class="w-full bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                  </div>
                  <div>
                    <label class="block text-[11px] text-evo-muted mb-1">Por Pomodoro</label>
                    <input type="number" id="rew-study" value="${state.rewardsConfig.studyPomodoro}"
                      class="w-full bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                  </div>
                  <div>
                    <label class="block text-[11px] text-evo-muted mb-1">Por entreno</label>
                    <input type="number" id="rew-workout" value="${state.rewardsConfig.workout}"
                      class="w-full bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                  </div>
                  <div>
                    <label class="block text-[11px] text-evo-muted mb-1">Por habilidad</label>
                    <input type="number" id="rew-skill" value="${state.rewardsConfig.skillPractice}"
                      class="w-full bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                  </div>
                  <button type="submit" class="col-span-2 bg-evo-surface hover:bg-zinc-800 border border-evo-border text-white font-medium text-xs py-2.5 rounded-xl cursor-pointer">
                    Actualizar valores
                  </button>
                </form>
              </div>

              <div class="pt-4 border-t border-evo-border space-y-2.5">
                <h4 class="text-xs font-semibold uppercase tracking-wider text-evo-muted">Copia de seguridad y reinicio</h4>
                <div class="flex flex-wrap gap-2">
                  <button onclick="exportBackup()" class="flex-1 bg-evo-surface hover:bg-zinc-800 border border-evo-border text-xs text-white py-2.5 px-3 rounded-xl cursor-pointer">
                    ↓ Exportar JSON
                  </button>
                  <button onclick="confirmFactoryReset()" class="flex-1 bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-xs text-red-300 py-2.5 px-3 rounded-xl cursor-pointer">
                    Reiniciar EVO
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('form-cfg-user').addEventListener('submit', (e) => {
        e.preventDefault();
        state.user.name = document.getElementById('cfg-name').value.trim();
        state.user.dob = document.getElementById('cfg-dob').value;
        state.user.age = calculateBirthdayInfo(state.user.dob).exactAge;
        state.user.password = document.getElementById('cfg-pass').value;
        saveState();
        showToast('Configuración de cuenta guardada');
      });

      document.getElementById('form-cfg-rewards').addEventListener('submit', (e) => {
        e.preventDefault();
        state.rewardsConfig.habit = parseInt(document.getElementById('rew-habit').value, 10) || 15;
        state.rewardsConfig.studyPomodoro = parseInt(document.getElementById('rew-study').value, 10) || 25;
        state.rewardsConfig.workout = parseInt(document.getElementById('rew-workout').value, 10) || 35;
        state.rewardsConfig.skillPractice = parseInt(document.getElementById('rew-skill').value, 10) || 20;
        saveState();
        showToast('Recompensas actualizadas');
      });
    }

    function updateMusicSettings() {
      state.audio.musicStyle = document.getElementById('cfg-music-style').value;
      saveState();
      if (state.audio.musicEnabled) SoundEngine.startMusic();
      showToast(`Estilo musical: ${state.audio.musicStyle.toUpperCase()}`);
    }

    function updateMusicVolume(val) {
      state.audio.musicVolume = parseFloat(val) || 0.25;
      saveState();
      renderConfiguracion(document.getElementById('app-viewport'));
    }

    function exportBackup() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(state, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute('href', dataStr);
      dlAnchor.setAttribute('download', `EVO_backup_${getTodayStr()}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
      showToast('Copia de seguridad descargada');
    }

    function confirmFactoryReset() {
      openModal({
        title: '¿Reiniciar EVO de fábrica?',
        desc: 'Se borrarán todos tus datos, monedas, ligas, hábitos y progreso guardado en este navegador.',
        confirmText: 'Sí, borrar todo',
        danger: true,
        onConfirm: () => {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem('evo_os_state_v1');
          state = JSON.parse(JSON.stringify(DEFAULT_STATE));
          initBoot();
          showToast('Sistema EVO reiniciado');
        }
      });
    }

    window.addEventListener('DOMContentLoaded', initBoot);
  </script>
</body>
</html>
