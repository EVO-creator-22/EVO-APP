<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVO — Personal Life OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            evo: {
              bg: '#09090b',
              card: '#121215',
              surface: '#18181c',
              border: '#27272a',
              accent: '#f4f4f5',
              muted: '#a1a1aa'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
    .glass-panel {
      background: rgba(18, 18, 21, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid #27272a;
    }
    .app-card {
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.25s ease;
    }
    .app-card:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: #52525b;
      background-color: #18181c;
      box-shadow: 0 14px 30px -12px rgba(0, 0, 0, 0.75);
    }
    .app-card:active, button:active {
      transform: scale(0.97);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes coinPopFloat {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); }
      20% { opacity: 1; transform: translate(-50%, -6px) scale(1.08); }
      80% { opacity: 1; transform: translate(-50%, -32px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -48px) scale(0.95); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.25); }
      50% { box-shadow: 0 0 18px 2px rgba(251, 191, 36, 0.35); }
    }
    .animate-fade {
      animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .coin-float {
      animation: coinPopFloat 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .coin-glow {
      animation: pulseGlow 2.4s infinite ease-in-out;
    }
    @media (prefers-reduced-motion: reduce) {
      .animate-fade, .coin-float, .coin-glow, .app-card {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-zinc-200 selection:text-zinc-900">

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-xs w-full px-4 sm:px-0"></div>

  <!-- FLOATING COIN POP CONTAINER -->
  <div id="coin-pop-layer" class="fixed inset-0 pointer-events-none z-50"></div>

  <!-- MODAL CONTAINER (For custom confirmations/inputs, never using alert/confirm) -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-40 hidden items-center justify-center p-4">
    <div id="modal-box" class="bg-evo-card border border-evo-border rounded-2xl max-w-md w-full p-6 shadow-2xl animate-fade">
      <h3 id="modal-title" class="text-lg font-semibold text-white mb-2"></h3>
      <p id="modal-desc" class="text-sm text-evo-muted mb-5"></p>
      <div id="modal-actions" class="flex justify-end gap-3"></div>
    </div>
  </div>

  <!-- ==================== 1. INITIAL SETUP (FIRST TIME ONBOARDING) ==================== -->
  <div id="screen-setup" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-evo-card border border-evo-border rounded-3xl p-6 sm:p-8 shadow-2xl animate-fade">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl bg-white text-black flex items-center justify-center font-bold text-lg tracking-tighter">
          EVO
        </div>
        <div>
          <h1 class="text-xl font-semibold tracking-tight text-white">Inicializar EVO</h1>
          <p class="text-xs text-evo-muted">Tu sistema operativo personal</p>
        </div>
      </div>

      <form id="form-setup" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-evo-muted mb-1.5">Tu nombre o alias</label>
          <input type="text" id="setup-name" required placeholder="Ej. Alex"
            class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-400 transition" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-evo-muted mb-1.5">Fecha de nacimiento</label>
            <input type="date" id="setup-dob" required
              class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-400 transition" />
          </div>
          <div>
            <label class="block text-xs font-medium text-evo-muted mb-1.5">Edad confirmada</label>
            <input type="number" id="setup-age" required min="10" max="99" placeholder="Ej. 15"
              class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-400 transition" />
          </div>
        </div>

        <div id="setup-bday-preview" class="hidden bg-evo-surface/70 border border-evo-border rounded-xl p-3 text-xs text-zinc-300 flex items-center justify-between">
          <span>🎂 Cumpleaños detectado:</span>
          <span id="setup-bday-text" class="font-medium text-white"></span>
        </div>

        <div>
          <label class="block text-xs font-medium text-evo-muted mb-1.5">Contraseña / PIN de acceso</label>
          <input type="password" id="setup-pass" required minlength="4" placeholder="Mínimo 4 caracteres"
            class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-400 transition" />
        </div>

        <div>
          <label class="block text-xs font-medium text-evo-muted mb-1.5">Confirmar contraseña</label>
          <input type="password" id="setup-pass-confirm" required minlength="4" placeholder="Repite tu contraseña"
            class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-400 transition" />
        </div>

        <p id="setup-error" class="text-xs text-red-400 hidden"></p>

        <button type="submit"
          class="w-full mt-2 bg-white hover:bg-zinc-200 text-black font-semibold text-sm py-3.5 rounded-xl transition cursor-pointer">
          Crear mi espacio EVO →
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== 2. LOCK SCREEN ==================== -->
  <div id="screen-lock" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-evo-card border border-evo-border rounded-3xl p-7 text-center shadow-2xl animate-fade">
      <div class="w-12 h-12 rounded-2xl bg-white text-black flex items-center justify-center font-bold text-xl tracking-tighter mx-auto mb-4">

        <p id="unlock-error" class="text-xs text-red-400 hidden">Contraseña incorrecta</p>
        <button type="submit"

  <!-- ==================== 3. MAIN EVO OS SHELL ==================== -->
  <div id="screen-main" class="hidden flex-1 flex flex-col">
    <!-- TOP BAR -->
    <header class="sticky top-0 z-30 glass-panel border-b border-evo-border">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
        <!-- Brand & Home button -->
        <div class="flex items-center gap-3">
          <button onclick="navigateTo('hub')" class="flex items-center gap-2.5 group cursor-pointer focus:outline-none">
            <div class="w-9 h-9 rounded-xl bg-white text-black flex items-center justify-center font-bold text-sm tracking-tighter group-hover:scale-105 transition">
              EVO
            </div>
            <div class="text-left">
              <span id="header-username" class="block text-sm font-semibold text-white leading-none">EVO OS</span>
              <span id="header-level" class="block text-[11px] text-evo-muted mt-0.5">Nivel 1 · 0 XP</span>
            </div>
          </button>
        </div>

        <!-- Right Stats, Audio & Lock -->
        <div class="flex items-center gap-1.5 sm:gap-2.5">
          <button onclick="toggleBgMusic()" id="btn-music-toggle" title="Música ambiental Lo-Fi / Synth"
            class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-evo-surface hover:bg-zinc-800 border border-evo-border text-xs text-evo-muted hover:text-white transition cursor-pointer">
            <span id="music-icon">♪</span>
            <span id="music-status-label" class="hidden lg:inline text-[11px]">Música</span>
          </button>

          <button onclick="toggleSfx()" id="btn-sfx-toggle" title="Efectos de sonido"
            class="p-2 rounded-xl bg-evo-surface hover:bg-zinc-800 border border-evo-border text-xs text-white transition cursor-pointer">
            <span id="sfx-icon">🔊</span>
          </button>

          <button onclick="navigateTo('tienda')" title="Ir a la Tienda EVO"
            class="coin-glow flex items-center gap-1.5 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer">
            <span>🪙</span>
            <span id="header-coins">0</span>
            <span class="hidden sm:inline text-amber-400/80 font-normal">EVO</span>
          </button>

          <button onclick="lockApp()" title="Bloquear EVO"
            class="p-2 rounded-xl bg-evo-surface hover:bg-zinc-800 border border-evo-border text-evo-muted hover:text-white transition cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT VIEWPORT -->
    <main id="app-viewport" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
      <!-- Dynamic Content Injected Here -->
    </main>

    <!-- MOBILE BOTTOM BAR -->
    <nav class="md:hidden sticky bottom-0 z-30 glass-panel border-t border-evo-border px-2 py-2 flex justify-around items-center">
      <button onclick="navigateTo('hub')" class="flex flex-col items-center p-1.5 text-[11px] text-evo-muted hover:text-white">
        <span class="text-base">⊞</span><span>Apps</span>
      </button>
      <button onclick="navigateTo('habitos')" class="flex flex-col items-center p-1.5 text-[11px] text-evo-muted hover:text-white">
        <span class="text-base">✓</span><span>Hábitos</span>
      </button>
      <button onclick="navigateTo('estudio')" class="flex flex-col items-center p-1.5 text-[11px] text-evo-muted hover:text-white">
        <span class="text-base">◷</span><span>Estudio</span>
      </button>
      <button onclick="navigateTo('tienda')" class="flex flex-col items-center p-1.5 text-[11px] text-amber-300">
        <span class="text-base">🪙</span><span>Tienda</span>
      </button>
      <button onclick="navigateTo('perfil')" class="flex flex-col items-center p-1.5 text-[11px] text-evo-muted hover:text-white">
        <span class="text-base">◉</span><span>Perfil</span>
      </button>
    </nav>
  </div>

  <script>
    // ==================== STATE MANAGEMENT & STORAGE ====================
    const STORAGE_KEY = 'evo_os_state_v1';

    const DEFAULT_STATE = {
      initialized: false,
      user: {
        name: '',
        dob: '',
        age: 15,
        password: '',
        coins: 50, // Welcome bonus
        xp: 0
      },
      audio: {
        sfxEnabled: true,
        musicEnabled: false,
        musicStyle: 'lofi', // 'lofi' | 'synth'
        musicVolume: 0.25
      },
      rewardsConfig: {
        habit: 15,
        studyPomodoro: 25,
        workout: 35,
        skillPractice: 20
      },
      apps: {
        perfil: {
          onboarded: true,
          bio: 'Construyendo mi mejor versión día a día.',
          mainGoal: 'Subir notas, mejorar físico y dominar finanzas.'
        },
        negocios: {
          onboarded: false,
          financialGoal: 500,
          monthlyGoal: 150,
          capital: 0,
          products: [],
          transactions: []
        },
        estudio: {
          onboarded: false,
          subjects: ['Matemáticas', 'Inglés', 'Catalán', 'Física y Química'],
          targetGrade: 8.5,
          tasks: [],
          grades: [],
          flashcards: [],
          pomodorosCompleted: 0,
          studyMinutes: 0
        },
        deporte: {
          onboarded: false,
          weeklyGoal: 3,
          focus: 'Fuerza y resistencia',
          waterGlasses: 0,
          recoveryScore: 8,
          sessions: []
        },
        habitos: {
          onboarded: false,
          list: []
        },
        habilidades: {
          onboarded: false,
          list: []
        },
        tienda: {
          onboarded: true,
          items: [
            { id: 'r1', title: '1 hora libre de ocio / videojuegos', cost: 60, category: 'Ocio', icon: '🎮' },
            { id: 'r2', title: 'Capricho o snack favorito', cost: 80, category: 'Comida', icon: '🍫' },
            { id: 'r3', title: 'Compra personal (hasta 15€)', cost: 250, category: 'Compra', icon: '🛍️' },
            { id: 'r4', title: 'Día sin tareas extra / descanso total', cost: 150, category: 'Descanso', icon: '🔋' }
          ],
          history: []
        },
        configuracion: {
          onboarded: true
        }
      }
    };

    let state = loadState();
    let currentView = 'hub';
    let pomodoroInterval = null;
    let pomodoroSeconds = 25 * 60;
    let pomodoroMode = 'focus'; // 'focus' | 'break'
    let pomodoroRunning = false;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        return {
          ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
          ...parsed,
          user: { ...DEFAULT_STATE.user, ...(parsed.user || {}) },
          rewardsConfig: { ...DEFAULT_STATE.rewardsConfig, ...(parsed.rewardsConfig || {}) },
          apps: {
            perfil: { ...DEFAULT_STATE.apps.perfil, ...(parsed.apps?.perfil || {}) },
            negocios: { ...DEFAULT_STATE.apps.negocios, ...(parsed.apps?.negocios || {}) },
            estudio: { ...DEFAULT_STATE.apps.estudio, ...(parsed.apps?.estudio || {}) },
            deporte: { ...DEFAULT_STATE.apps.deporte, ...(parsed.apps?.deporte || {}) },
            habitos: { ...DEFAULT_STATE.apps.habitos, ...(parsed.apps?.habitos || {}) },
            habilidades: { ...DEFAULT_STATE.apps.habilidades, ...(parsed.apps?.habilidades || {}) },
            tienda: { ...DEFAULT_STATE.apps.tienda, ...(parsed.apps?.tienda || {}) },
            configuracion: { ...DEFAULT_STATE.apps.configuracion, ...(parsed.apps?.configuracion || {}) }
          }
        };
      } catch (e) {
        console.error('Error loading EVO state:', e);
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    // ==================== WEB AUDIO API SOUND & MUSIC ENGINE ====================
    const SoundEngine = {
      ctx: null,
      musicTimer: null,
      stepIndex: 0,

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      },

      playClick(pitch = 520) {
        if (!state.audio.sfxEnabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(pitch * 0.65, now + 0.055);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      },

      playCoin() {
        if (!state.audio.sfxEnabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = [987.77, 1318.51]; // B5 -> E6 coin chime
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const start = now + idx * 0.075;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.11, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.3);
        });
      },

      playFanfare() {
        if (!state.audio.sfxEnabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const chord = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
        chord.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const t = now + idx * 0.07;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.09, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.36);
        });
      },

      playLock(locking = true) {
        if (!state.audio.sfxEnabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        if (locking) {
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.16);
        } else {
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.16);
        }
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.19);
      },

      startMusic() {
        this.stopMusic();
        if (!state.audio.musicEnabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;

        // Gentle lo-fi / synth arpeggio loop (Fmaj7 -> Em7 -> Dm7 -> Cmaj7 frequencies)
        const lofiNotes = [174.61, 220.0, 261.63, 329.63, 164.81, 196.0, 246.94, 293.66, 146.83, 174.61, 220.0, 261.63, 130.81, 196.0, 246.94, 329.63];
        const synthNotes = [220.0, 277.18, 329.63, 440.0, 196.0, 246.94, 293.66, 392.0, 174.61, 220.0, 261.63, 349.23, 164.81, 246.94, 329.63, 493.88];

        const tick = () => {
          if (!state.audio.musicEnabled || !this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});

          const notes = state.audio.musicStyle === 'synth' ? synthNotes : lofiNotes;
          const freq = notes[this.stepIndex % notes.length];
          this.stepIndex++;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = state.audio.musicStyle === 'synth' ? 'sawtooth' : 'sine';
          osc.frequency.setValueAtTime(freq, now);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(state.audio.musicStyle === 'synth' ? 950 : 620, now);

          const vol = Math.max(0.01, Math.min(0.6, state.audio.musicVolume)) * 0.14;
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.68);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.7);
        };

        tick();
        const intervalMs = state.audio.musicStyle === 'synth' ? 420 : 540;
        this.musicTimer = setInterval(tick, intervalMs);
      },

      stopMusic() {
        if (this.musicTimer) {
          clearInterval(this.musicTimer);
          this.musicTimer = null;
        }
      }
    };

    function syncAudioButtons() {
      const sfxIcon = document.getElementById('sfx-icon');
      const musicIcon = document.getElementById('music-icon');
      const musicLabel = document.getElementById('music-status-label');
      const musicBtn = document.getElementById('btn-music-toggle');

      if (sfxIcon) sfxIcon.textContent = state.audio.sfxEnabled ? '🔊' : '🔇';
      if (musicIcon) musicIcon.textContent = state.audio.musicEnabled ? '🎵' : '♪';
      if (musicLabel) musicLabel.textContent = state.audio.musicEnabled ? 'On' : 'Música';
      if (musicBtn) {
        if (state.audio.musicEnabled) {
          musicBtn.classList.add('border-emerald-500/40', 'text-emerald-300', 'bg-emerald-500/10');
        } else {

    // ==================== UTILITIES & GAMIFICATION ====================
    function getTodayStr() {
      return new Date().toISOString().split('T')[0];
    }

    function calculateBirthdayInfo(dobStr) {
      if (!dobStr) return { formatted: 'No definida', daysLeft: 0, exactAge: state.user.age };
      const parts = dobStr.split('-').map(Number);
      const birthYear = parts[0], birthMonth = parts[1] - 1, birthDay = parts[2];
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let exactAge = today.getFullYear() - birthYear;
      const mDiff = today.getMonth() - birthMonth;
      if (mDiff < 0 || (mDiff === 0 && today.getDate() < birthDay)) {
        exactAge--;
      }

      let nextBday = new Date(today.getFullYear(), birthMonth, birthDay);
      if (nextBday < today) {
        nextBday.setFullYear(today.getFullYear() + 1);
      }
      const diffTime = nextBday - today;
      const daysLeft = Math.round(diffTime / (1000 * 60 * 60 * 24));

      const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const formatted = `${birthDay} de ${months[birthMonth]}`;
      return { formatted, daysLeft, exactAge };
    }

    function getLevelInfo(xp) {
      const level = Math.floor(xp / 100) + 1;
      const currentLevelXp = xp % 100;
      return { level, currentLevelXp, nextLevelXp: 100 };
    }

    function addRewards(coins, xp, reason) {
      const prevLevel = getLevelInfo(state.user.xp).level;
      state.user.coins += coins;
      state.user.xp += xp;
      const newLevel = getLevelInfo(state.user.xp).level;
      saveState();
      SoundEngine.playCoin();
      spawnCoinPop(`+${coins} 🪙 · +${xp} XP`);
      showToast(`+${coins} 🪙 EVO Coins · +${xp} XP (${reason})`, 'coin');
      if (newLevel > prevLevel) {
        SoundEngine.playFanfare();
        showToast(`¡Subiste al Nivel ${newLevel}!`, 'coin');
      }
    }

    function spendCoins(amount, reason) {
      if (state.user.coins < amount) {
        SoundEngine.playClick(220);
        showToast(`Te faltan ${amount - state.user.coins} 🪙 EVO Coins`, 'error');
        return false;
      }
      state.user.coins -= amount;
      saveState();
      SoundEngine.playFanfare();
      showToast(`-${amount} 🪙 Canjeado: ${reason}`, 'info');
      return true;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      let borderClass = 'border-evo-border bg-evo-card text-white';
      if (type === 'coin') borderClass = 'border-amber-500/40 bg-zinc-900 text-amber-200';
      if (type === 'error') borderClass = 'border-red-500/40 bg-zinc-900 text-red-300';

      el.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-xl text-xs font-medium flex items-center justify-between gap-2 animate-fade ${borderClass}`;
      el.innerHTML = `<span>${escapeHTML(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        el.style.transition = 'all 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 3000);
    }

    function openModal({ title, desc, confirmText = 'Confirmar', cancelText = 'Cancelar', danger = false, onConfirm }) {
      const backdrop = document.getElementById('modal-backdrop');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-desc').textContent = desc;
      const actions = document.getElementById('modal-actions');
      actions.innerHTML = '';

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'px-4 py-2 rounded-xl text-xs font-medium bg-evo-surface hover:bg-zinc-800 text-zinc-300 border border-evo-border cursor-pointer';
      cancelBtn.textContent = cancelText;
      cancelBtn.onclick = closeModal;

      const confirmBtn = document.createElement('button');
      confirmBtn.className = danger
        ? 'px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 hover:bg-red-500 text-white cursor-pointer'
        : 'px-4 py-2 rounded-xl text-xs font-semibold bg-white hover:bg-zinc-200 text-black cursor-pointer';
      confirmBtn.textContent = confirmText;
      confirmBtn.onclick = () => {
        closeModal();
        if (onConfirm) onConfirm();
      };

      actions.appendChild(cancelBtn);
      actions.appendChild(confirmBtn);
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

            <h2 class="text-xl font-bold text-white">Configurar Negocios & Finanzas</h2>
            <p class="text-xs text-evo-muted mt-1 mb-6">Responde estas preguntas rápidas para adaptar tu panel financiero.</p>
            <form id="form-biz-onboard" class="space-y-4">
              <div>
                <label class="block text-xs text-evo-muted mb-1.5">¿Con cuánto dinero o capital inicial empiezas (€)?</label>
                <input type="number" step="0.01" id="biz-init-cap" required value="${biz.capital}" placeholder="Ej. 50"
                  class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-400" />
              </div>
              <div>
                <label class="block text-xs text-evo-muted mb-1.5">¿Cuál es tu primera meta de ahorro o beneficio (€)?</label>
                <input type="number" step="0.01" id="biz-init-goal" required value="${biz.financialGoal}" placeholder="Ej. 300"
                  class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-400" />
              </div>
              <div>
                <label class="block text-xs text-evo-muted mb-1.5">Meta mensual de ingresos/beneficio (€)</label>
                <input type="number" step="0.01" id="biz-monthly-goal" required value="${biz.monthlyGoal || 150}"
                  class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-zinc-400" />
              </div>
              <button type="submit" class="w-full bg-white hover:bg-zinc-200 text-black font-semibold text-sm py-3 rounded-xl transition cursor-pointer">
                Guardar y entrar a Finanzas →
              </button>
            </form>
          </div>
        `;
        document.getElementById('form-biz-onboard').addEventListener('submit', (e) => {
          e.preventDefault();
          biz.capital = parseFloat(document.getElementById('biz-init-cap').value) || 0;
          biz.financialGoal = parseFloat(document.getElementById('biz-init-goal').value) || 100;
          biz.monthlyGoal = parseFloat(document.getElementById('biz-monthly-goal').value) || 150;
          biz.onboarded = true;
          saveState();
          renderNegocios(container);
        });
        return;
      }

      const progressPct = Math.min(100, Math.max(0, Math.round((biz.capital / (biz.financialGoal || 1)) * 100)));
      const totalIncome = biz.transactions.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0);
      const totalExpense = biz.transactions.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
      const netFlow = totalIncome - totalExpense;
      const monthlyPct = Math.min(100, Math.max(0, Math.round((Math.max(0, netFlow) / (biz.monthlyGoal || 1)) * 100)));

      const financeTips = [
        { title: 'Regla 1: Págate a ti primero', text: 'Cuando recibas dinero, aparta antes un % fijo para ahorro/inversión antes de gastar en ocio.' },
        { title: 'Regla 2: Margen real en ventas', text: 'Beneficio real = Precio de venta − Coste del producto − Envío/comisiones. Nunca mires solo lo que cobras.' },
        { title: 'Regla 3: Coste de oportunidad', text: 'Cada euro gastado por impulso es un euro que no puedes usar cuando aparezca una buena oportunidad.' }
      ];

      container.innerHTML = `
        <div class="animate-fade space-y-6">
          ${appHeaderHTML('Negocios & Finanzas', 'Capital, catálogo/stock, flujo neto y calculadora de margen', '◈', 'resetBizOnboarding()')}

          <!-- Top Financial Metrics -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-evo-card border border-evo-border rounded-2xl p-5">
              <span class="text-xs text-evo-muted">Capital actual</span>
              <p class="text-2xl font-bold text-white mt-1">${biz.capital.toFixed(2)} €</p>
            </div>
            <div class="bg-evo-card border border-evo-border rounded-2xl p-5">
              <span class="text-xs text-evo-muted">Flujo neto registrado</span>
              <p class="text-2xl font-bold ${netFlow >= 0 ? 'text-emerald-400' : 'text-red-400'} mt-1">${netFlow >= 0 ? '+' : ''}${netFlow.toFixed(2)} €</p>
            </div>
            <div class="bg-evo-card border border-evo-border rounded-2xl p-5">
              <div class="flex justify-between text-xs text-evo-muted mb-2">
                <span>Meta capital (${biz.financialGoal}€)</span>
                <span class="text-white font-semibold">${progressPct}%</span>
              </div>
              <div class="w-full h-2.5 bg-zinc-800 rounded-full overflow-hidden mt-3">
                <div class="h-full bg-emerald-400 rounded-full transition-all duration-500" style="width: ${progressPct}%"></div>
              </div>
            </div>
            <div class="bg-evo-card border border-evo-border rounded-2xl p-5">
              <div class="flex justify-between text-xs text-evo-muted mb-2">
                <span>Meta mensual (${biz.monthlyGoal || 150}€)</span>
                <span class="text-white font-semibold">${monthlyPct}%</span>
              </div>
              <div class="w-full h-2.5 bg-zinc-800 rounded-full overflow-hidden mt-3">
                <div class="h-full bg-amber-400 rounded-full transition-all duration-500" style="width: ${monthlyPct}%"></div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Add Movement + Margin Calculator -->
            <div class="bg-evo-card border border-evo-border rounded-3xl p-6 space-y-4">
              <h3 class="text-sm font-semibold text-white">Registrar movimiento</h3>
              <form id="form-biz-tx" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                  <select id="tx-type" class="bg-evo-surface border border-evo-border rounded-xl px-3 py-2.5 text-xs text-white">
                    <option value="income">+ Ingreso / Venta</option>
                    <option value="expense">- Gasto / Compra</option>
                  </select>
                  <input type="number" step="0.01" min="0.01" id="tx-amount" required placeholder="Cantidad (€)"
                    class="bg-evo-surface border border-evo-border rounded-xl px-3 py-2.5 text-xs text-white" />
                </div>
                <input type="text" id="tx-concept" required placeholder="Concepto (ej. Ahorro semanal, Venta...)"
                  class="w-full bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs text-white" />
                <button type="submit" class="w-full bg-white hover:bg-zinc-200 text-black font-semibold text-xs py-2.5 rounded-xl transition cursor-pointer">
                  Añadir movimiento (+5 🪙)
                </button>
              </form>

              <!-- Margin Calculator -->
              <div class="pt-4 border-t border-evo-border space-y-3">
                <h4 class="text-xs font-semibold uppercase tracking-wider text-evo-muted">Calculadora de margen rápido</h4>
                <div class="grid grid-cols-2 gap-2">
                  <input type="number" step="0.01" id="calc-cost" placeholder="Coste (€)" oninput="calcMargin()"
                    class="bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                  <input type="number" step="0.01" id="calc-sell" placeholder="Venta (€)" oninput="calcMargin()"
                    class="bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                </div>
                <div id="calc-result" class="text-xs bg-evo-surface border border-evo-border rounded-xl p-3 text-evo-muted">
                  Introduce coste y precio de venta para ver el beneficio neto.
                </div>
              </div>
            </div>

            <!-- Products & Inventory Manager -->
            <div class="bg-evo-card border border-evo-border rounded-3xl p-6 space-y-4">
              <h3 class="text-sm font-semibold text-white">Productos / Ideas & Stock</h3>
              <form id="form-biz-product" class="space-y-2">
                <input type="text" id="prod-name" required placeholder="Nombre del producto o servicio..."
                  class="w-full bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2 text-xs text-white" />
                <div class="grid grid-cols-3 gap-2">
                  <input type="number" step="0.01" min="0" id="prod-cost" required placeholder="Coste €"
                    class="bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                  <input type="number" step="0.01" min="0" id="prod-price" required placeholder="Precio €"
                    class="bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                  <input type="number" min="0" id="prod-stock" required placeholder="Stock"
                    class="bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                </div>
                <button type="submit" class="w-full bg-evo-surface hover:bg-zinc-800 border border-evo-border text-white font-semibold text-xs py-2 rounded-xl transition cursor-pointer">
                  + Guardar producto en catálogo
                </button>
              </form>

              <div class="space-y-2 max-h-60 overflow-y-auto">
                ${biz.products.length === 0 ? '<p class="text-xs text-evo-muted">Aún no tienes productos en tu catálogo.</p>' : ''}
                ${biz.products.map(p => {
                  const unitProfit = (p.price - p.cost).toFixed(2);
                  return `
                    <div class="bg-evo-surface border border-evo-border rounded-xl p-3 text-xs flex items-center justify-between gap-2">
                      <div>
                        <p class="font-semibold text-white">${escapeHTML(p.name)}</p>
                        <span class="text-[11px] text-evo-muted">Venta ${p.price.toFixed(2)}€ · Beneficio +${unitProfit}€ · Stock: <strong class="text-white">${p.stock}</strong></span>
                      </div>
                      <div class="flex items-center gap-1.5">
                        <button onclick="sellProductUnit('${p.id}')" ${p.stock <= 0 ? 'disabled' : ''}
                          class="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold transition cursor-pointer ${p.stock > 0 ? 'bg-emerald-400 hover:bg-emerald-300 text-black' : 'bg-zinc-800 text-zinc-600 cursor-not-allowed'}">
                          Vender
                        </button>
                        <button onclick="deleteProduct('${p.id}')" class="text-zinc-500 hover:text-red-400 px-1 cursor-pointer">✕</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Transactions History + Tips -->
            <div class="bg-evo-card border border-evo-border rounded-3xl p-6 flex flex-col justify-between space-y-4">
              <div>
                <h3 class="text-sm font-semibold text-white mb-3">Historial reciente</h3>
                <div class="space-y-2 overflow-y-auto max-h-48">
                  ${biz.transactions.length === 0 ? '<p class="text-xs text-evo-muted">Aún no hay movimientos registrados.</p>' : ''}
                  ${biz.transactions.slice().reverse().map(tx => `
                    <div class="flex items-center justify-between bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2 text-xs">
                      <div>
                        <p class="font-medium text-white">${escapeHTML(tx.concept)}</p>
                        <span class="text-[11px] text-evo-muted">${escapeHTML(tx.date)}</span>
                      </div>
                      <span class="font-semibold ${tx.type === 'income' ? 'text-emerald-400' : 'text-red-400'}">
                        ${tx.type === 'income' ? '+' : '-'}${tx.amount.toFixed(2)} €
                      </span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="space-y-2 pt-3 border-t border-evo-border">
                <h4 class="text-xs font-semibold text-white">Principios clave</h4>
                ${financeTips.slice(0, 2).map(t => `
                  <div class="bg-evo-surface border border-evo-border rounded-xl p-3">
                    <h5 class="text-[11px] font-semibold text-white">${t.title}</h5>
                    <p class="text-[11px] text-evo-muted leading-snug mt-0.5">${t.text}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('form-biz-tx').addEventListener('submit', (e) => {
        e.preventDefault();
        const type = document.getElementById('tx-type').value;
        const amount = parseFloat(document.getElementById('tx-amount').value);
        const concept = document.getElementById('tx-concept').value.trim();
        if (!amount || amount <= 0) return;

        if (type === 'income') biz.capital += amount;
        else biz.capital = Math.max(0, biz.capital - amount);

        biz.transactions.push({
          id: Date.now(),
          type,
          amount,
          concept,
          date: new Date().toLocaleDateString('es-ES')
        });
        addRewards(5, 10, 'Registro financiero');
        renderNegocios(container);
      });

      document.getElementById('form-biz-product').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('prod-name').value.trim();
        const cost = parseFloat(document.getElementById('prod-cost').value) || 0;
        const price = parseFloat(document.getElementById('prod-price').value) || 0;
        const stock = parseInt(document.getElementById('prod-stock').value, 10) || 0;
        biz.products.push({ id: 'p_' + Date.now(), name, cost, price, stock });
        saveState();
        SoundEngine.playClick(660);
        showToast('Producto añadido al catálogo');
        renderNegocios(container);
      });
    }

    function sellProductUnit(id) {
      const biz = state.apps.negocios;
      const prod = biz.products.find(p => p.id === id);
      if (!prod || prod.stock <= 0) return;
      prod.stock -= 1;
      biz.capital += prod.price;
      biz.transactions.push({
        id: Date.now(),
        type: 'income',
        amount: prod.price,
        concept: `Venta: ${prod.name}`,
        date: new Date().toLocaleDateString('es-ES')
      });
      addRewards(10, 15, `Venta de ${prod.name}`);
      renderNegocios(document.getElementById('app-viewport'));
    }

    function deleteProduct(id) {
      state.apps.negocios.products = state.apps.negocios.products.filter(p => p.id !== id);
      saveState();
      renderNegocios(document.getElementById('app-viewport'));
    }

    function calcMargin() {
      const cost = parseFloat(document.getElementById('calc-cost').value) || 0;
      const sell = parseFloat(document.getElementById('calc-sell').value) || 0;
      const resEl = document.getElementById('calc-result');
      if (cost === 0 && sell === 0) return;
      const profit = sell - cost;
      const margin = sell > 0 ? ((profit / sell) * 100).toFixed(1) : 0;
      resEl.innerHTML = `Beneficio: <strong class="${profit >= 0 ? 'text-emerald-400' : 'text-red-400'}">${profit.toFixed(2)} €</strong> · Margen: <strong class="text-white">${margin}%</strong>`;
    }

    // ==================== 3. ESTUDIO ====================
    function renderEstudio(container) {
      const est = state.apps.estudio;

      if (!est.onboarded) {
        container.innerHTML = `
          <div class="animate-fade max-w-lg mx-auto bg-evo-card border border-evo-border rounded-3xl p-6 sm:p-8 mt-4">
            <div class="text-2xl mb-2">◷</div>
            <h2 class="text-xl font-bold text-white">Configurar Estudio</h2>
            <p class="text-xs text-evo-muted mt-1 mb-6">Define tus asignaturas principales y tu objetivo de nota.</p>
            <form id="form-est-onboard" class="space-y-4">
              <div>
                <label class="block text-xs text-evo-muted mb-1.5">Asignaturas principales (separadas por comas)</label>
                <input type="text" id="est-subjects-input" required value="${escapeHTML(est.subjects.join(', '))}"
                  class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs text-evo-muted mb-1.5">Meta de nota media</label>
                <input type="number" step="0.1" min="5" max="10" id="est-target-input" required value="${est.targetGrade}"
                  class="w-full bg-evo-surface border border-evo-border rounded-xl px-4 py-3 text-sm text-white" />
              </div>
              <button type="submit" class="w-full bg-white hover:bg-zinc-200 text-black font-semibold text-sm py-3 rounded-xl transition cursor-pointer">
                Guardar y abrir Estudio →
              </button>
            </form>
          </div>
        `;
        document.getElementById('form-est-onboard').addEventListener('submit', (e) => {
          e.preventDefault();
          const rawSubs = document.getElementById('est-subjects-input').value;
          est.subjects = rawSubs.split(',').map(s => s.trim()).filter(Boolean);
          est.targetGrade = parseFloat(document.getElementById('est-target-input').value) || 8.0;
          est.onboarded = true;
          saveState();
          renderEstudio(container);
        });
        return;
      }

      const avgGrade = est.grades.length > 0
        ? (est.grades.reduce((acc, g) => acc + g.score, 0) / est.grades.length).toFixed(2)
        : '—';

      container.innerHTML = `
        <div class="animate-fade space-y-6">
          ${appHeaderHTML('Centro de Estudio', `Meta: ${est.targetGrade} · Media: ${avgGrade} · ${est.studyMinutes || 0} min estudiados`, '◷', 'resetEstOnboarding()')}

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Pomodoro Timer -->
            <div class="bg-evo-card border border-evo-border rounded-3xl p-6 text-center flex flex-col justify-between">
              <div>
                <div class="flex justify-center gap-2 mb-4">
                  <button onclick="setPomodoroMode('focus')" class="px-3 py-1 rounded-lg text-xs font-medium ${pomodoroMode === 'focus' ? 'bg-white text-black' : 'bg-evo-surface text-evo-muted'} cursor-pointer">Enfoque (25m)</button>
                  <button onclick="setPomodoroMode('break')" class="px-3 py-1 rounded-lg text-xs font-medium ${pomodoroMode === 'break' ? 'bg-white text-black' : 'bg-evo-surface text-evo-muted'} cursor-pointer">Descanso (5m)</button>
                </div>
                <div id="pomodoro-display" class="text-5xl font-bold tracking-tight text-white my-6 font-mono">
                  ${formatSeconds(pomodoroSeconds)}
                </div>
                <p class="text-xs text-evo-muted mb-6">Completa un bloque de enfoque para ganar <span class="text-amber-300 font-semibold">+${state.rewardsConfig.studyPomodoro} 🪙</span></p>
              </div>

              <div class="space-y-2">
                <div class="flex gap-2">
                  <button onclick="togglePomodoro()" id="pomodoro-btn" class="flex-1 bg-white hover:bg-zinc-200 text-black font-semibold text-xs py-3 rounded-xl transition cursor-pointer">
                    ${pomodoroRunning ? 'Pausar' : 'Iniciar sesión'}
                  </button>
                  <button onclick="resetPomodoro()" class="px-4 py-3 rounded-xl bg-evo-surface hover:bg-zinc-800 border border-evo-border text-xs text-white cursor-pointer">
                    ↺
                  </button>
                </div>
            <!-- Grades Tracker + Flashcards -->
            <div class="bg-evo-card border border-evo-border rounded-3xl p-6 space-y-5">
              <div>
                <h3 class="text-sm font-semibold text-white mb-3">Registro de notas</h3>
                <form id="form-est-grade" class="space-y-2">
                  <select id="grade-subject" class="w-full bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white">
                    ${est.subjects.map(s => `<option value="${escapeHTML(s)}">${escapeHTML(s)}</option>`).join('')}
                  </select>
                  <div class="flex gap-2">
                    <input type="text" id="grade-label" required placeholder="Examen / Global"
                      class="flex-1 bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                    <input type="number" step="0.01" min="0" max="10" id="grade-score" required placeholder="Nota"
                      class="w-20 bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                    <button type="submit" class="px-3 py-2 rounded-xl bg-white text-black font-semibold text-xs cursor-pointer">+</button>
                  </div>
                </form>

                <div class="space-y-2 max-h-40 overflow-y-auto mt-3">
                  ${est.grades.length === 0 ? '<p class="text-xs text-evo-muted">Registra tus exámenes para ver tu media.</p>' : ''}
                  ${est.grades.slice().reverse().map(g => `
                    <div class="flex items-center justify-between bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs">
                      <div>
                        <p class="font-medium text-white">${escapeHTML(g.subject)}</p>
                        <span class="text-[10px] text-evo-muted">${escapeHTML(g.label)}</span>
                      </div>
                      <span class="font-bold px-2.5 py-1 rounded-lg ${g.score >= est.targetGrade ? 'bg-emerald-500/15 text-emerald-400' : 'bg-zinc-800 text-white'}">
                        ${g.score.toFixed(2)}
                      </span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Quick Study Flashcards -->
              <div class="pt-4 border-t border-evo-border space-y-2.5">
                <h3 class="text-sm font-semibold text-white">Repaso rápido (Flashcards)</h3>
                <form id="form-est-card" class="space-y-2">
                  <input type="text" id="card-q" required placeholder="Pregunta o concepto clave..."
                    class="w-full bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                  <div class="flex gap-2">
                    <input type="text" id="card-a" required placeholder="Respuesta corta..."
                      class="flex-1 bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                    <button type="submit" class="px-3 py-2 rounded-xl bg-white text-black font-semibold text-xs cursor-pointer">+</button>
                  </div>
                </form>
                <div class="space-y-2 max-h-44 overflow-y-auto">
                  ${(est.flashcards || []).length === 0 ? '<p class="text-xs text-evo-muted">Crea tarjetas para repasar antes de un examen.</p>' : ''}
                  ${(est.flashcards || []).map(c => `
                    <div class="bg-evo-surface border border-evo-border rounded-xl p-3 text-xs">
                      <p class="font-medium text-white">❓ ${escapeHTML(c.q)}</p>
                      <p class="text-emerald-300 mt-1">💡 ${escapeHTML(c.a)}</p>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('form-est-task').addEventListener('submit', (e) => {
        e.preventDefault();
        est.tasks.push({
          id: Date.now(),
          subject: document.getElementById('task-subject').value,
          title: document.getElementById('task-title').value.trim(),
          done: false
        });
        saveState();
        renderEstudio(container);
      });

      document.getElementById('form-est-grade').addEventListener('submit', (e) => {
        e.preventDefault();
        const score = parseFloat(document.getElementById('grade-score').value);
        est.grades.push({
          id: Date.now(),
          subject: document.getElementById('grade-subject').value,
          label: document.getElementById('grade-label').value.trim(),
          score
        });
        if (score >= 7) addRewards(15, 20, 'Buena nota registrada');
        else saveState();
        renderEstudio(container);
      });

      document.getElementById('form-est-card').addEventListener('submit', (e) => {
        e.preventDefault();
        if (!est.flashcards) est.flashcards = [];
        est.flashcards.push({
          id: Date.now(),
          q: document.getElementById('card-q').value.trim(),
          a: document.getElementById('card-a').value.trim()
        });
        addRewards(5, 5, 'Flashcard creada');
        renderEstudio(container);
      });
    }

    function resetEstOnboarding() {
      state.apps.estudio.onboarded = false;
      saveState();
      renderEstudio(document.getElementById('app-viewport'));
    }

    function formatSeconds(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function setPomodoroMode(mode) {
      clearInterval(pomodoroInterval);
      pomodoroRunning = false;
      pomodoroMode = mode;
      pomodoroSeconds = mode === 'focus' ? 25 * 60 : 5 * 60;
      if (currentView === 'estudio') renderEstudio(document.getElementById('app-viewport'));
    }

    function togglePomodoro() {
      if (pomodoroRunning) {
        clearInterval(pomodoroInterval);
        pomodoroRunning = false;
      } else {
        pomodoroRunning = true;
        pomodoroInterval = setInterval(() => {
          pomodoroSeconds--;
          const disp = document.getElementById('pomodoro-display');
          if (disp) disp.textContent = formatSeconds(pomodoroSeconds);
          if (pomodoroSeconds <= 0) {
            clearInterval(pomodoroInterval);
            pomodoroRunning = false;
            if (pomodoroMode === 'focus') {
              completePomodoroNow();
              setPomodoroMode('break');
            } else {
              showToast('Descanso terminado. ¡Vuelta al enfoque!');
              setPomodoroMode('focus');
            }
          }
        }, 1000);
      }
      const btn = document.getElementById('pomodoro-btn');
      if (btn) btn.textContent = pomodoroRunning ? 'Pausar' : 'Iniciar sesión';
    }

    function resetPomodoro() {
      setPomodoroMode(pomodoroMode);
    }

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  ${shop.items.map(item => {
                    const canAfford = state.user.coins >= item.cost;
                    return `
                      <div class="bg-evo-surface border border-evo-border rounded-2xl p-4 flex flex-col justify-between gap-4">
                        <div>
                          <div class="flex items-center justify-between">
                            <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded bg-zinc-800 text-evo-muted">${escapeHTML(item.icon || '🎁')} ${escapeHTML(item.category)}</span>
                            <button onclick="deleteShopItem('${item.id}')" class="text-zinc-500 hover:text-red-400 text-xs cursor-pointer">✕</button>
                          </div>
                          <h4 class="text-sm font-semibold text-white mt-2">${escapeHTML(item.title)}</h4>
                        </div>
                        <button onclick="redeemShopItem('${item.id}')"
                          class="w-full py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer ${canAfford ? 'bg-amber-400 hover:bg-amber-300 text-black' : 'bg-zinc-800 text-zinc-500'}">
                          Canjear por 🪙 ${item.cost}
                        </button>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- Create Custom Reward -->
              <div class="bg-evo-card border border-evo-border rounded-3xl p-6">
                <h3 class="text-sm font-semibold text-white mb-3">Crear recompensa personalizada</h3>
                <form id="form-shop-add" class="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
                  <input type="text" id="shop-icon" value="🎁" maxlength="2"
                    class="bg-evo-surface border border-evo-border rounded-xl px-3 py-2.5 text-center text-sm text-white" />
                  <input type="text" id="shop-title" required placeholder="Ej. Comprar camiseta / Partida extra"
                    class="sm:col-span-2 bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs text-white" />
                  <input type="number" min="5" id="shop-cost" required placeholder="Precio (🪙)"
                    class="bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs text-white" />
                  <button type="submit" class="bg-white hover:bg-zinc-200 text-black font-semibold text-xs py-2.5 rounded-xl cursor-pointer">
                    + Crear
                  </button>
                </form>
              </div>
            </div>

            <!-- Redemption History -->
            <div class="bg-evo-card border border-evo-border rounded-3xl p-6">
              <h3 class="text-sm font-semibold text-white mb-4">Historial de canjes</h3>
              <div class="space-y-2.5 max-h-96 overflow-y-auto">
                ${shop.history.length === 0 ? '<p class="text-xs text-evo-muted">Aún no has canjeado ninguna recompensa.</p>' : ''}
                ${shop.history.slice().reverse().map(h => `
                  <div class="bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs flex items-center justify-between">
                    <div>
                      <p class="font-medium text-white">${escapeHTML(h.title)}</p>
                      <span class="text-[10px] text-evo-muted">${escapeHTML(h.date)}</span>
                    </div>
                    <span class="text-amber-300 font-semibold">-🪙 ${h.cost}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('form-shop-add').addEventListener('submit', (e) => {
        e.preventDefault();
        const icon = (document.getElementById('shop-icon').value || '🎁').trim();
        const title = document.getElementById('shop-title').value.trim();
        const cost = parseInt(document.getElementById('shop-cost').value, 10);
        if (!title || !cost) return;
        shop.items.push({ id: 'r_' + Date.now(), icon, title, cost, category: 'Personal' });
        saveState();
        renderTienda(container);
      });
    }

    function redeemShopItem(id) {
      const item = state.apps.tienda.items.find(x => x.id === id);
      if (!item) return;
      if (!spendCoins(item.cost, item.title)) return;
      state.apps.tienda.history.push({
        title: item.title,
        cost: item.cost,
        date: new Date().toLocaleDateString('es-ES')
      });
      saveState();
      renderTienda(document.getElementById('app-viewport'));
    }

    function deleteShopItem(id) {
      state.apps.tienda.items = state.apps.tienda.items.filter(x => x.id !== id);
      saveState();
      renderTienda(document.getElementById('app-viewport'));
    }

    // ==================== 8. CONFIGURACIÓN ====================
    function renderConfiguracion(container) {
      container.innerHTML = `
        <div class="animate-fade space-y-6">
          ${appHeaderHTML('Configuración del Sistema', 'Seguridad, economía de monedas y copia de seguridad', '⚙')}

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Account & Security -->
            <div class="bg-evo-card border border-evo-border rounded-3xl p-6 space-y-4">
              <h3 class="text-sm font-semibold text-white">Datos y Contraseña</h3>
              <form id="form-cfg-user" class="space-y-3">
                <div>
                  <label class="block text-xs text-evo-muted mb-1">Nombre</label>
                  <input type="text" id="cfg-name" required value="${escapeHTML(state.user.name)}"
                    class="w-full bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs text-white" />
                </div>
                <div>
                  <label class="block text-xs text-evo-muted mb-1">Fecha de nacimiento</label>
                  <input type="date" id="cfg-dob" required value="${escapeHTML(state.user.dob)}"
                    class="w-full bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs text-white" />
                </div>
                <div>
                  <label class="block text-xs text-evo-muted mb-1">Nueva contraseña (dejar igual si no cambia)</label>
                  <input type="password" id="cfg-pass" required minlength="4" value="${escapeHTML(state.user.password)}"
                    class="w-full bg-evo-surface border border-evo-border rounded-xl px-3.5 py-2.5 text-xs text-white" />
                </div>
                <button type="submit" class="w-full bg-white hover:bg-zinc-200 text-black font-semibold text-xs py-2.5 rounded-xl cursor-pointer">
                  Guardar cambios
                </button>
              </form>
            </div>

            <!-- Rewards Balance & Backup -->
            <div class="bg-evo-card border border-evo-border rounded-3xl p-6 space-y-5">
              <div>
                <h3 class="text-sm font-semibold text-white mb-3">Audio y Música Ambiental</h3>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-[11px] text-evo-muted mb-1">Estilo musical</label>
                    <select id="cfg-music-style" onchange="updateMusicSettings()"
                      class="w-full bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white">
                      <option value="lofi" ${state.audio.musicStyle === 'lofi' ? 'selected' : ''}>Lo-Fi Relajado</option>
                      <option value="synth" ${state.audio.musicStyle === 'synth' ? 'selected' : ''}>Synth Enfoque</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-[11px] text-evo-muted mb-1">Volumen (${Math.round((state.audio.musicVolume || 0.25) * 100)}%)</label>
                    <input type="range" min="0.05" max="0.6" step="0.05" value="${state.audio.musicVolume || 0.25}"
                      onchange="updateMusicVolume(this.value)" class="w-full accent-white cursor-pointer mt-2" />
                  </div>
                </div>
              </div>

              <div class="pt-4 border-t border-evo-border">
                <h3 class="text-sm font-semibold text-white mb-3">Ajustar recompensas (EVO Coins)</h3>
                <form id="form-cfg-rewards" class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-[11px] text-evo-muted mb-1">Por hábito</label>
                    <input type="number" id="rew-habit" value="${state.rewardsConfig.habit}"
                      class="w-full bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                  </div>
                  <div>
                    <label class="block text-[11px] text-evo-muted mb-1">Por Pomodoro</label>
                    <input type="number" id="rew-study" value="${state.rewardsConfig.studyPomodoro}"
                      class="w-full bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                  </div>
                  <div>
                    <label class="block text-[11px] text-evo-muted mb-1">Por entreno</label>
                    <input type="number" id="rew-workout" value="${state.rewardsConfig.workout}"
                      class="w-full bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                  </div>
                  <div>
                    <label class="block text-[11px] text-evo-muted mb-1">Por habilidad</label>
                    <input type="number" id="rew-skill" value="${state.rewardsConfig.skillPractice}"
                      class="w-full bg-evo-surface border border-evo-border rounded-xl px-3 py-2 text-xs text-white" />
                  </div>
                  <button type="submit" class="col-span-2 bg-evo-surface hover:bg-zinc-800 border border-evo-border text-white font-medium text-xs py-2.5 rounded-xl cursor-pointer">
                    Actualizar valores
                  </button>
                </form>
              </div>

              <div class="pt-4 border-t border-evo-border space-y-2.5">
                <h4 class="text-xs font-semibold uppercase tracking-wider text-evo-muted">Copia de seguridad y reinicio</h4>
                <div class="flex flex-wrap gap-2">
                  <button onclick="exportBackup()" class="flex-1 bg-evo-surface hover:bg-zinc-800 border border-evo-border text-xs text-white py-2.5 px-3 rounded-xl cursor-pointer">
                    ↓ Exportar JSON
                  </button>
                  <button onclick="confirmFactoryReset()" class="flex-1 bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-xs text-red-300 py-2.5 px-3 rounded-xl cursor-pointer">
                    Reiniciar EVO
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('form-cfg-user').addEventListener('submit', (e) => {
        e.preventDefault();
        state.user.name = document.getElementById('cfg-name').value.trim();
        state.user.dob = document.getElementById('cfg-dob').value;
        state.user.age = calculateBirthdayInfo(state.user.dob).exactAge;
        state.user.password = document.getElementById('cfg-pass').value;
        saveState();
        showToast('Configuración de cuenta guardada');
      });

      document.getElementById('form-cfg-rewards').addEventListener('submit', (e) => {
        e.preventDefault();
        state.rewardsConfig.habit = parseInt(document.getElementById('rew-habit').value, 10) || 15;
        state.rewardsConfig.studyPomodoro = parseInt(document.getElementById('rew-study').value, 10) || 25;
        state.rewardsConfig.workout = parseInt(document.getElementById('rew-workout').value, 10) || 35;
        state.rewardsConfig.skillPractice = parseInt(document.getElementById('rew-skill').value, 10) || 20;
        saveState();
        showToast('Recompensas actualizadas');
      });
    }

    function updateMusicSettings() {
      state.audio.musicStyle = document.getElementById('cfg-music-style').value;
      saveState();
      if (state.audio.musicEnabled) SoundEngine.startMusic();
      showToast(`Estilo musical: ${state.audio.musicStyle.toUpperCase()}`);
    }

    function updateMusicVolume(val) {
      state.audio.musicVolume = parseFloat(val) || 0.25;
      saveState();
      renderConfiguracion(document.getElementById('app-viewport'));
    }

    function confirmFactoryReset() {
      openModal({
        title: '¿Reiniciar EVO de fábrica?',
        desc: 'Se borrarán todos tus datos, monedas, hábitos y progreso guardado en este navegador.',
        confirmText: 'Sí, borrar todo',
        danger: true,
        onConfirm: () => {
          localStorage.removeItem(STORAGE_KEY);
          state = JSON.parse(JSON.stringify(DEFAULT_STATE));
          initBoot();
          showToast('Sistema EVO reiniciado');
        }
      });
    }

    // Boot EVO OS
    window.addEventListener('DOMContentLoaded', initBoot);
  </script>
</body>
</html>
